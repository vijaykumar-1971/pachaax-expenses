bn: {
  title:"ব্যবহারকারী নির্দেশিকা",
  intro:"যেকোনো বিভাগ খুলতে সেটিতে ট্যাপ করুন। উপরের ❓ আইকন দিয়ে যেকোনো সময় এখানে ফিরে আসতে পারেন।",
  close:"বুঝেছি",
  sections:[
    {t:"🚀 শুরু করুন", open:true, b:["আপনার নাম, ইমেইল ও পাসওয়ার্ড (৬+ অক্ষর) দিয়ে নিবন্ধন করুন। আপনার ইমেইলে একটি OTP পাঠানো হবে; অ্যাকাউন্ট সক্রিয় করতে সেটি লিখুন।",
      ["প্রথম নিবন্ধিত অ্যাকাউন্টটি <strong>Admin</strong> হবে।", "পাসওয়ার্ড ভুলে গেছেন? লগইন পর্দায় <strong>Forgot password</strong> ব্যবহার করুন এবং ইমেইলে আসা OTP লিখুন।", "লগইনের পর স্টোরি পর্দা আসবে। নতুন স্টোরি তৈরি করুন বা তালিকা থেকে একটি খুলুন।"]]},
    {t:"📖 স্টোরি", open:false, b:["<strong>স্টোরি</strong> হলো যৌথ খরচের একটি ভ্রমণ বা দল, যেমন \"গোয়া ট্রিপ ২০২৬\"।",
      ["<strong>তৈরি করুন:</strong> স্টোরির নাম, উদ্দেশ্য ও শুরুর তারিখ লিখে <em>Start Story</em> চাপুন। আপনি এর মালিক হবেন।", "<strong>পরিবর্তন করুন:</strong> উপরের বারে 🔀 চেপে স্টোরি তালিকায় ফিরে যান।", "<strong>অ্যাক্সেস দিন:</strong> মালিকরা 🔑 চেপে ইমেইল বা গ্রুপের মাধ্যমে অন্য নিবন্ধিত ব্যবহারকারীদের অ্যাক্সেস দিতে পারেন।", "<strong>মুছুন:</strong> মালিকরা Expenses ট্যাবের 🗑️ বোতাম দিয়ে স্টোরি মুছতে পারেন।"]]},
    {t:"👥 Friends ট্যাব", open:false, b:[["<strong>সদস্য:</strong> নাম দিয়ে কাউকে যোগ করতে <em>+ Add Friend</em> চাপুন। ✕ দিয়ে সরান (খরচ থাকলে সরানো যাবে না)। স্টোরির মালিককে সরানো যাবে না।", "<strong>Share</strong> প্রত্যেকের মোট অংশ দেখায়। <strong>Gets back / Owes</strong> পেমেন্টের পর তাদের অবস্থা দেখায়।", "<strong>আমার গ্রুপ:</strong> ইমেইলের একটি গ্রুপ তৈরি করুন (যেমন পরিবার) এবং <em>Grant Story Access</em> চেপে সবাইকে একসাথে অ্যাক্সেস দিন।"]]},
    {t:"💸 খরচ যোগ করা", open:false, b:["Expenses ট্যাব খুলে <strong>+ Add</strong> চাপুন। পূরণ করুন:",
      ["<strong>বিবরণ</strong>, <strong>মুদ্রা</strong> ও <strong>পরিমাণ</strong>।", "<strong>কে পরিশোধ করেছে</strong>, ঐচ্ছিক <strong>শ্রেণি</strong>, এবং <strong>তারিখ / সময়</strong>।", "<strong>ভাগের ধরন:</strong> নিচের চারটি বোতামের একটি বেছে নিন।"],
      ["<strong>⚖️ Equal:</strong> সবার মধ্যে সমানভাবে ভাগ করুন।", "<strong>👥 Exclude:</strong> সমানভাবে ভাগ করুন, তবে যাদের পরিশোধ করতে হবে না তাদের টিক তুলে দিন।", "<strong>🧮 Share:</strong> প্রত্যেককে আলাদা সংখ্যক অংশ দিন (যেমন দম্পতিকে ২, শিশুকে ১)। মোট অংশ সদস্য সংখ্যার সমান হতে হবে, নইলে Add বন্ধ থাকবে।", "<strong>✏️ Custom:</strong> প্রত্যেকের সঠিক পরিমাণ লিখুন, অথবা % বেছে এমন শতাংশ লিখুন যা মোট ১০০ হয়।"],
      "খরচ সম্পাদনার জন্য ✏️ এবং মুছতে ✕ চাপুন। মোটের সাথে না মিললে পরিমাণ সংরক্ষিত হবে না।"]},
    {t:"🌍 একাধিক মুদ্রা", open:false, b:[["খরচ যোগ করার সময় যেকোনো মুদ্রা বেছে নিন। রেট বক্সে আজকের রেট ও রূপান্তরিত মোট দেখা যাবে।", "প্রত্যেকের অংশ আপনার পছন্দের মুদ্রাতেও দেখানো হয়।", "<strong>My Profile</strong> (উপরে ডানদিকে আপনার অক্ষরে চাপুন) থেকে পছন্দের মুদ্রা ঠিক করুন। সব মোট, ব্যালেন্স ও পেমেন্ট তাতেই দেখানো হয়।", "রেট প্রতিদিন স্বয়ংক্রিয়ভাবে আপডেট হয়।"]]},
    {t:"📊 বাজেট (Expenses → Budget)", open:false, b:[["পরিকল্পিত বাজেটের সাপেক্ষে শ্রেণিভিত্তিক খরচ দেখায়।", "মালিক ও অ্যাডমিনরা কোনো শ্রেণিতে ✏️ চেপে বাজেট ঠিক করতে পারেন।", "শ্রেণিগুলো অ্যাডমিন পরিচালনা করেন (👑 Admin → Categories)।"]]},
    {t:"🤝 হিসাব মিটিয়ে নিন", open:false, b:[["<strong>Current Balances</strong> পেমেন্টের পর কে কার কাছে পাবে বা কার দেওয়ার আছে তা দেখায়।", "<strong>Payments to Make</strong> কে কাকে পরিশোধ করবে তার তালিকা দেয়। <em>Pay UPI</em> চাপলে পরিমাণসহ UPI অ্যাপ খুলবে।", "পরিশোধের পর <em>Mark Paid</em> চেপে পরিমাণ (পূর্ণ বা আংশিক) লিখুন। তালিকা স্বয়ংক্রিয়ভাবে আপডেট হবে।", "<strong>Payment History</strong> সব রেকর্ড করা পেমেন্ট দেখায়। ভুল হলে ↩️ Undo ব্যবহার করুন।"]]},
    {t:"📝 স্মৃতি", open:false, b:["স্টোরির নোট বা প্রিয় মুহূর্ত লিখুন। অ্যাক্সেস থাকা সবাই পড়তে পারবেন। নিজের স্মৃতি সম্পাদনা বা মুছতে পারবেন।"]},
    {t:"📤 সারসংক্ষেপ ও শেয়ার", open:false, b:[["<strong>Summary</strong> ট্যাব সব স্টোরির মোট হিসাব এবং প্রতিটি স্টোরির কার্ড দেখায়।", "কোনো স্টোরিতে <em>Export &amp; Share</em> চাপুন:"],
      ["<strong>CSV ডাউনলোড:</strong> Excel বা Google Sheets-এর জন্য সম্পূর্ণ প্রতিবেদন।", "<strong>Share as Text:</strong> WhatsApp, SMS বা ইমেইলের জন্য ছোট বার্তা।", "<strong>Share with Pay UPI Buttons:</strong> চাপলেই পরিশোধ করা যায় এমন বোতামসহ ওয়েব পেজ।"]]},
    {t:"👤 আমার প্রোফাইল", open:false, b:[["উপরে ডানদিকে আপনার অক্ষরে চেপে নাম ও পছন্দের মুদ্রা বদলান।", "নাম বদলালে আপনি যে স্টোরিগুলোতে আছেন সেখানেও তা আপডেট হবে।"]]},
    {t:"👑 Admin (শুধু অ্যাডমিনদের জন্য)", open:false, b:[["<strong>Users:</strong> নতুন সাইন-আপ যাচাই করুন, ব্যবহারকারীকে ব্লক বা আনব্লক করুন, কাউকে অ্যাডমিন করুন, বা অ্যাকাউন্ট মুছুন।", "<strong>Stories:</strong> সব স্টোরি দেখুন ও যেকোনোটি মুছুন।", "<strong>Categories:</strong> সবার জন্য খরচের শ্রেণি যোগ বা সরিয়ে দিন।"]]},
    {t:"💡 জেনে রাখুন", open:false, b:[["অ্যাপ প্রতি ১০ সেকেন্ডে স্বয়ংক্রিয়ভাবে আপডেট হয়।", "স্টোরি বদলাতে 🔀 এবং লগ আউট করতে ⏏️ চাপুন।"]]}
  ]
},
ml: {
  title:"ഉപയോക്തൃ ഗൈഡ്",
  intro:"ഏതെങ്കിലും വിഭാഗം തുറക്കാൻ അതിൽ ടാപ്പ് ചെയ്യുക. മുകളിലെ ❓ ഐക്കൺ ഉപയോഗിച്ച് എപ്പോൾ വേണമെങ്കിലും ഇവിടേക്ക് മടങ്ങാം.",
  close:"മനസ്സിലായി",
  sections:[
    {t:"🚀 തുടങ്ങാം", open:true, b:["നിങ്ങളുടെ പേര്, ഇമെയിൽ, പാസ്‌വേഡ് (6+ അക്ഷരങ്ങൾ) എന്നിവ നൽകി രജിസ്റ്റർ ചെയ്യുക. നിങ്ങളുടെ ഇമെയിലിലേക്ക് OTP അയയ്ക്കും; അക്കൗണ്ട് സജീവമാക്കാൻ അത് നൽകുക.",
      ["ആദ്യം രജിസ്റ്റർ ചെയ്ത അക്കൗണ്ട് <strong>Admin</strong> ആകും.", "പാസ്‌വേഡ് മറന്നോ? ലോഗിൻ സ്ക്രീനിലെ <strong>Forgot password</strong> ഉപയോഗിച്ച് ഇമെയിലിൽ വന്ന OTP നൽകുക.", "ലോഗിൻ ചെയ്ത ശേഷം സ്റ്റോറി സ്ക്രീൻ കാണാം. പുതിയ സ്റ്റോറി ഉണ്ടാക്കുക അല്ലെങ്കിൽ പട്ടികയിൽ നിന്ന് ഒന്ന് തുറക്കുക."]]},
    {t:"📖 സ്റ്റോറികൾ", open:false, b:["<strong>സ്റ്റോറി</strong> എന്നാൽ പങ്കിട്ട ചെലവുകളുള്ള ഒരു യാത്രയോ ഗ്രൂപ്പോ ആണ്, ഉദാ. \"ഗോവ യാത്ര 2026\".",
      ["<strong>സൃഷ്ടിക്കുക:</strong> സ്റ്റോറിയുടെ പേര്, ലക്ഷ്യം, ആരംഭ തീയതി നൽകി <em>Start Story</em> ടാപ്പ് ചെയ്യുക. നിങ്ങൾ അതിന്റെ ഉടമയാകും.", "<strong>മാറുക:</strong> മുകളിലെ ബാറിലെ 🔀 ടാപ്പ് ചെയ്ത് സ്റ്റോറി പട്ടികയിലേക്ക് മടങ്ങുക.", "<strong>ആക്സസ് നൽകുക:</strong> ഉടമകൾക്ക് 🔑 ടാപ്പ് ചെയ്ത് ഇമെയിൽ വഴിയോ ഗ്രൂപ്പ് വഴിയോ മറ്റ് രജിസ്റ്റർ ചെയ്ത ഉപയോക്താക്കൾക്ക് ആക്സസ് നൽകാം.", "<strong>ഇല്ലാതാക്കുക:</strong> ഉടമകൾക്ക് Expenses ടാബിലെ 🗑️ ബട്ടൺ ഉപയോഗിച്ച് സ്റ്റോറി ഇല്ലാതാക്കാം."]]},
    {t:"👥 Friends ടാബ്", open:false, b:[["<strong>അംഗങ്ങൾ:</strong> പേര് നൽകി ഒരാളെ ചേർക്കാൻ <em>+ Add Friend</em> ടാപ്പ് ചെയ്യുക. ✕ ഉപയോഗിച്ച് നീക്കം ചെയ്യാം (ചെലവുകൾ ഉണ്ടെങ്കിൽ സാധ്യമല്ല). സ്റ്റോറിയുടെ ഉടമയെ നീക്കാനാവില്ല.", "<strong>Share</strong> ഓരോരുത്തരുടെയും ആകെ വിഹിതം കാണിക്കുന്നു. <strong>Gets back / Owes</strong> പണമടച്ച ശേഷമുള്ള അവരുടെ നില കാണിക്കുന്നു.", "<strong>എന്റെ ഗ്രൂപ്പുകൾ:</strong> ഇമെയിലുകളുടെ ഗ്രൂപ്പ് ഉണ്ടാക്കി (ഉദാ. കുടുംബം) <em>Grant Story Access</em> ടാപ്പ് ചെയ്ത് എല്ലാവർക്കും ഒരുമിച്ച് ആക്സസ് നൽകുക."]]},
    {t:"💸 ചെലവ് ചേർക്കൽ", open:false, b:["Expenses ടാബ് തുറന്ന് <strong>+ Add</strong> ടാപ്പ് ചെയ്യുക. പൂരിപ്പിക്കുക:",
      ["<strong>വിവരണം</strong>, <strong>കറൻസി</strong>, <strong>തുക</strong>.", "<strong>ആരാണ് പണം നൽകിയത്</strong>, ഐച്ഛിക <strong>വിഭാഗം</strong>, <strong>തീയതി / സമയം</strong>.", "<strong>വിഭജന രീതി:</strong> താഴെയുള്ള നാല് ബട്ടണുകളിൽ ഒന്ന് തിരഞ്ഞെടുക്കുക."],
      ["<strong>⚖️ Equal:</strong> എല്ലാ അംഗങ്ങൾക്കും തുല്യമായി വിഭജിക്കുക.", "<strong>👥 Exclude:</strong> തുല്യമായി വിഭജിക്കുക, പക്ഷേ പണം നൽകേണ്ടതില്ലാത്തവരുടെ ടിക് മാറ്റുക.", "<strong>🧮 Share:</strong> ഓരോരുത്തർക്കും വ്യത്യസ്ത എണ്ണം ഓഹരികൾ നൽകുക (ഉദാ. ഒരു ദമ്പതികൾക്ക് 2, കുട്ടിക്ക് 1). ആകെ ഓഹരികൾ അംഗങ്ങളുടെ എണ്ണത്തിന് തുല്യമായിരിക്കണം, അല്ലെങ്കിൽ Add പ്രവർത്തനരഹിതമാകും.", "<strong>✏️ Custom:</strong> ഓരോരുത്തർക്കും കൃത്യമായ തുക നൽകുക, അല്ലെങ്കിൽ % തിരഞ്ഞെടുത്ത് 100 ആകുന്ന ശതമാനങ്ങൾ നൽകുക."],
      "ചെലവ് തിരുത്താൻ ✏️, നീക്കാൻ ✕ ടാപ്പ് ചെയ്യുക. ആകെ തുകയുമായി ചേരാത്ത തുകകൾ സേവ് ചെയ്യില്ല."]},
    {t:"🌍 ഒന്നിലധികം കറൻസികൾ", open:false, b:[["ചെലവ് ചേർക്കുമ്പോൾ ഏത് കറൻസിയും തിരഞ്ഞെടുക്കാം. റേറ്റ് ബോക്സ് ഇന്നത്തെ നിരക്കും പരിവർത്തനം ചെയ്ത തുകയും കാണിക്കും.", "ഓരോ വിഹിതവും നിങ്ങളുടെ ഇഷ്ട കറൻസിയിലും കാണിക്കും.", "<strong>My Profile</strong> (മുകളിൽ വലതുവശത്ത് നിങ്ങളുടെ അക്ഷരങ്ങളിൽ ടാപ്പ് ചെയ്യുക) ൽ ഇഷ്ട കറൻസി സെറ്റ് ചെയ്യുക. എല്ലാ ആകെ തുകകളും ബാലൻസുകളും പേയ്‌മെന്റുകളും അതിലാണ് കാണുക.", "നിരക്കുകൾ ഓരോ ദിവസവും സ്വയമേവ പുതുക്കപ്പെടും."]]},
    {t:"📊 ബജറ്റ് (Expenses → Budget)", open:false, b:[["ആസൂത്രണം ചെയ്ത ബജറ്റുമായി താരതമ്യം ചെയ്ത് വിഭാഗം തിരിച്ചുള്ള ചെലവ് കാണിക്കുന്നു.", "ഉടമകൾക്കും അഡ്മിനുകൾക്കും ഒരു വിഭാഗത്തിലെ ✏️ ടാപ്പ് ചെയ്ത് ബജറ്റ് നിശ്ചയിക്കാം.", "വിഭാഗങ്ങൾ അഡ്മിൻ നിയന്ത്രിക്കുന്നു (👑 Admin → Categories)."]]},
    {t:"🤝 കണക്ക് തീർക്കുക", open:false, b:[["<strong>Current Balances</strong> പണമടച്ച ശേഷം ആർക്ക് പണം കിട്ടണം, ആർ കൊടുക്കണം എന്ന് കാണിക്കുന്നു.", "<strong>Payments to Make</strong> ആര് ആർക്ക് പണം നൽകണം എന്ന് പട്ടികപ്പെടുത്തുന്നു. <em>Pay UPI</em> ടാപ്പ് ചെയ്താൽ തുക നിറച്ച UPI ആപ്പ് തുറക്കും.", "പണമടച്ച ശേഷം <em>Mark Paid</em> ടാപ്പ് ചെയ്ത് തുക (പൂർണമോ ഭാഗികമോ) നൽകുക. പട്ടിക സ്വയമേവ പുതുക്കപ്പെടും.", "<strong>Payment History</strong> രേഖപ്പെടുത്തിയ എല്ലാ പേയ്‌മെന്റുകളും കാണിക്കുന്നു. തെറ്റുണ്ടെങ്കിൽ ↩️ Undo ഉപയോഗിക്കുക."]]},
    {t:"📝 ഓർമ്മകൾ", open:false, b:["സ്റ്റോറിയിലെ കുറിപ്പുകളോ പ്രിയപ്പെട്ട നിമിഷങ്ങളോ എഴുതുക. ആക്സസ് ഉള്ള എല്ലാവർക്കും അവ വായിക്കാം. നിങ്ങളുടെ ഓർമ്മകൾ തിരുത്താനോ ഇല്ലാതാക്കാനോ കഴിയും."]},
    {t:"📤 സംഗ്രഹവും പങ്കിടലും", open:false, b:[["<strong>Summary</strong> ടാബ് എല്ലാ സ്റ്റോറികളുടെയും ആകെ തുകയും ഓരോ സ്റ്റോറിയുടെയും കാർഡും കാണിക്കുന്നു.", "ഒരു സ്റ്റോറിയിൽ <em>Export &amp; Share</em> ടാപ്പ് ചെയ്യുക:"],
      ["<strong>CSV ഡൗൺലോഡ്:</strong> Excel അല്ലെങ്കിൽ Google Sheets-നുള്ള പൂർണ റിപ്പോർട്ട്.", "<strong>Share as Text:</strong> WhatsApp, SMS അല്ലെങ്കിൽ ഇമെയിലിനുള്ള ചെറിയ സന്ദേശം.", "<strong>Share with Pay UPI Buttons:</strong> ടാപ്പ് ചെയ്ത് പണമടയ്ക്കാവുന്ന ബട്ടണുകളുള്ള വെബ് പേജ്."]]},
    {t:"👤 എന്റെ പ്രൊഫൈൽ", open:false, b:[["മുകളിൽ വലതുവശത്ത് നിങ്ങളുടെ അക്ഷരങ്ങളിൽ ടാപ്പ് ചെയ്ത് പേരും ഇഷ്ട കറൻസിയും മാറ്റുക.", "പേര് മാറ്റിയാൽ നിങ്ങൾ ഉൾപ്പെടുന്ന സ്റ്റോറികളിലും അത് പുതുക്കപ്പെടും."]]},
    {t:"👑 Admin (അഡ്മിനുകൾക്ക് മാത്രം)", open:false, b:[["<strong>Users:</strong> പുതിയ സൈൻ-അപ്പുകൾ പരിശോധിക്കുക, ഉപയോക്താക്കളെ ബ്ലോക്ക് അല്ലെങ്കിൽ അൺബ്ലോക്ക് ചെയ്യുക, ആരെയെങ്കിലും അഡ്മിൻ ആക്കുക, അല്ലെങ്കിൽ അക്കൗണ്ട് ഇല്ലാതാക്കുക.", "<strong>Stories:</strong> എല്ലാ സ്റ്റോറികളും കാണുകയും ഏതെങ്കിലും ഇല്ലാതാക്കുകയും ചെയ്യുക.", "<strong>Categories:</strong> എല്ലാവർക്കും ലഭ്യമായ ചെലവ് വിഭാഗങ്ങൾ ചേർക്കുകയോ നീക്കുകയോ ചെയ്യുക."]]},
    {t:"💡 അറിഞ്ഞിരിക്കേണ്ടവ", open:false, b:[["ആപ്പ് ഓരോ 10 സെക്കൻഡിലും സ്വയമേവ പുതുക്കപ്പെടും.", "സ്റ്റോറി മാറാൻ 🔀 ഉം ലോഗ് ഔട്ട് ചെയ്യാൻ ⏏️ ഉം ടാപ്പ് ചെയ്യുക."]]}
  ]
},
gu: {
  title:"વપરાશકર્તા માર્ગદર્શિકા",
  intro:"કોઈ પણ વિભાગ ખોલવા માટે તેના પર ટૅપ કરો. ઉપરના ❓ આઇકનનો ઉપયોગ કરીને ગમે ત્યારે અહીં પાછા આવી શકો છો.",
  close:"સમજાઈ ગયું",
  sections:[
    {t:"🚀 શરૂઆત કરો", open:true, b:["તમારું નામ, ઇમેઇલ અને પાસવર્ડ (6+ અક્ષરો) આપીને નોંધણી કરો. તમારા ઇમેઇલ પર OTP મોકલવામાં આવશે; ખાતું સક્રિય કરવા તે દાખલ કરો.",
      ["સૌપ્રથમ નોંધાયેલું ખાતું <strong>Admin</strong> બનશે.", "પાસવર્ડ ભૂલી ગયા? લોગિન સ્ક્રીન પર <strong>Forgot password</strong> વાપરો અને ઇમેઇલ પર આવેલો OTP દાખલ કરો.", "લોગિન પછી સ્ટોરી સ્ક્રીન દેખાશે. નવી સ્ટોરી બનાવો અથવા યાદીમાંથી એક ખોલો."]]},
    {t:"📖 સ્ટોરીઓ", open:false, b:["<strong>સ્ટોરી</strong> એટલે વહેંચેલા ખર્ચ સાથેની સફર અથવા જૂથ, દા.ત. \"ગોવા ટ્રિપ 2026\".",
      ["<strong>બનાવો:</strong> સ્ટોરીનું નામ, હેતુ અને શરૂઆતની તારીખ લખીને <em>Start Story</em> દબાવો. તમે તેના માલિક બનશો.", "<strong>બદલો:</strong> ઉપરની પટ્ટીમાં 🔀 દબાવીને સ્ટોરી યાદી પર પાછા જાઓ.", "<strong>ઍક્સેસ આપો:</strong> માલિકો 🔑 દબાવીને ઇમેઇલ અથવા જૂથ દ્વારા અન્ય નોંધાયેલા વપરાશકર્તાઓને ઍક્સેસ આપી શકે છે.", "<strong>કાઢી નાખો:</strong> માલિકો Expenses ટૅબમાંના 🗑️ બટનથી સ્ટોરી કાઢી શકે છે."]]},
    {t:"👥 Friends ટૅબ", open:false, b:[["<strong>સભ્યો:</strong> નામથી કોઈને ઉમેરવા <em>+ Add Friend</em> દબાવો. ✕ થી દૂર કરો (ખર્ચ હોય તો શક્ય નથી). સ્ટોરીના માલિકને દૂર કરી શકાતા નથી.", "<strong>Share</strong> દરેકનો કુલ હિસ્સો બતાવે છે. <strong>Gets back / Owes</strong> ચુકવણી પછી તેમની સ્થિતિ બતાવે છે.", "<strong>મારા જૂથો:</strong> ઇમેઇલનું જૂથ બનાવો (દા.ત. પરિવાર) અને <em>Grant Story Access</em> દબાવીને બધાને એકસાથે ઍક્સેસ આપો."]]},
    {t:"💸 ખર્ચ ઉમેરવો", open:false, b:["Expenses ટૅબ ખોલીને <strong>+ Add</strong> દબાવો. ભરો:",
      ["<strong>વર્ણન</strong>, <strong>ચલણ</strong> અને <strong>રકમ</strong>.", "<strong>કોણે ચૂકવ્યું</strong>, વૈકલ્પિક <strong>શ્રેણી</strong>, અને <strong>તારીખ / સમય</strong>.", "<strong>વહેંચણીનો પ્રકાર:</strong> નીચેના ચાર બટનોમાંથી એક પસંદ કરો."],
      ["<strong>⚖️ Equal:</strong> બધા સભ્યો વચ્ચે સરખા ભાગે વહેંચો.", "<strong>👥 Exclude:</strong> સરખા ભાગે વહેંચો, પણ જેમણે ચૂકવવાનું ન હોય તેમની ટિક કાઢી નાખો.", "<strong>🧮 Share:</strong> દરેકને અલગ-અલગ સંખ્યામાં ભાગ આપો (દા.ત. યુગલને 2, બાળકને 1). કુલ ભાગ સભ્યોની સંખ્યા જેટલા હોવા જોઈએ, નહીંતર Add બંધ રહેશે.", "<strong>✏️ Custom:</strong> દરેક માટે ચોક્કસ રકમ લખો, અથવા % પસંદ કરીને કુલ 100 થાય તેવી ટકાવારી લખો."],
      "ખર્ચ બદલવા ✏️ અને કાઢવા ✕ દબાવો. કુલ રકમ સાથે મેળ ન ખાતી રકમો સેવ થતી નથી."]},
    {t:"🌍 બહુવિધ ચલણ", open:false, b:[["ખર્ચ ઉમેરતી વખતે કોઈ પણ ચલણ પસંદ કરો. રેટ બૉક્સ આજનો દર અને રૂપાંતરિત રકમ બતાવશે.", "દરેક ભાગ તમારા પસંદગીના ચલણમાં પણ બતાવાશે.", "<strong>My Profile</strong> (ઉપર જમણી બાજુ તમારા અક્ષરો પર ટૅપ કરો) માં પસંદગીનું ચલણ સેટ કરો. બધા કુલ, બાકી અને ચુકવણીઓ તેમાં જ દેખાશે.", "દરો દરરોજ આપમેળે અપડેટ થાય છે."]]},
    {t:"📊 બજેટ (Expenses → Budget)", open:false, b:[["આયોજિત બજેટ સામે શ્રેણી પ્રમાણે ખર્ચ બતાવે છે.", "માલિકો અને એડમિન કોઈ શ્રેણી પર ✏️ દબાવીને બજેટ નક્કી કરી શકે છે.", "શ્રેણીઓ એડમિન (👑 Admin → Categories) દ્વારા જાળવવામાં આવે છે."]]},

function mGuide(){
  var T=GUIDE_TEXT[guideLang]||GUIDE_TEXT.en;
  var P=s=>`<p style="margin:0 0 6px">${s}</p>`;
  var UL=items=>`<ul style="margin:0 0 6px 18px;padding:0">${items.map(i=>`<li style="margin-bottom:3px">${i}</li>`).join('')}</ul>`;
  var body=sec=>sec.b.map(x=>Array.isArray(x)?UL(x):P(x)).join('');
  var D=sec=>`<details ${sec.open?'open':''} style="border:2px solid #fed7aa;border-radius:10px;padding:9px 12px;margin-bottom:8px;background:white">
    <summary style="font-weight:900;font-size:13px;color:#92400e;cursor:pointer">${sec.t}</summary>
    <div style="font-size:12px;color:#374151;line-height:1.55;margin-top:8px">${body(sec)}</div>
  </details>`;
  var langOpts=Object.entries(GUIDE_LANGS).map(([k,v])=>`<option value="${k}" ${k===guideLang?'selected':''}>${v}</option>`).join('');

  return `<div class="overlay" onclick="modal=null;render()">
    <div class="modal" onclick="event.stopPropagation()" style="max-width:480px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px">
        <h3 style="margin:0">❓ ${T.title}</h3>
        <select onchange="setGuideLang(this.value)" style="border:2px solid #fed7aa;border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700;color:#92400e;background:white;outline:none;font-family:inherit">${langOpts}</select>
      </div>
      <p style="font-size:11px;color:#6b7280;margin:0 0 12px">${T.intro}</p>
      ${T.sections.map(D).join('')}
      <div class="mbtns" style="margin-top:6px">
        <button class="btn primary" onclick="modal=null;render()">${T.close}</button>
      </div>
    </div>
  </div>`;
}

function mMarkPaid(){
  var sets=settlements();
  var s=sets.find(x=>x.from===_mpFrom&&x.to===_mpTo);
  var owed=s?s.remaining:_mpOwed;
  var sym=currencySymbol(userCurrency());
  return `<div class="overlay" onclick="modal=null;render()">
    <div class="modal" onclick="event.stopPropagation()">
      <h3>💸 Record Payment</h3>
      ${s?`<div style="background:#f0fdf4;border-radius:9px;padding:10px 12px;margin-bottom:12px;font-size:13px">
        <div style="font-weight:700;color:#374151">${gname(s.from)} → ${gname(s.to)}</div>
        <div style="color:#6b7280;margin-top:2px">
          Total owed: <strong>${sym}${Math.round(s.amount)}</strong>
          ${s.totalPaid>0?` · Paid so far: <strong style="color:#16a34a">${sym}${Math.round(s.totalPaid)}</strong>`:''}
        </div>
        <div style="font-size:12px;font-weight:700;color:#ef4444;margin-top:2px">Remaining: ${sym}${Math.round(owed)}</div>
      </div>`:''}
      <span class="lbl">Amount Being Paid Now (${userCurrency()})</span>
      <input id="mp-amt" class="f" type="number" inputmode="decimal" placeholder="0"
        oninput="(function(){var v=parseFloat(document.getElementById('mp-amt').value)||0;var d=document.getElementById('mp-diff');if(!d)return;var diff=${owed}-v;if(v<=0){d.textContent='';return;}if(Math.abs(diff)<0.01){d.innerHTML='<span style=\\'color:#16a34a;font-weight:700\\'>✅ Fully settled</span>';}else if(diff>0){d.innerHTML='<span style=\\'color:#d97706;font-weight:700\\'>⚠️ Still remaining: ${sym}'+Math.round(diff)+'</span>';}else{d.innerHTML='<span style=\\'color:#7c3aed;font-weight:700\\'>ℹ️ Overpaying by ${sym}'+Math.round(-diff)+'</span>';}})()"
        onkeydown="if(event.key==='Enter')doMarkPaid()">
      <div id="mp-diff" style="font-size:12px;color:#6b7280;margin:-4px 0 10px;min-height:18px"></div>
      <div class="mbtns">
        <button class="btn secondary" onclick="modal=null;render()">Cancel</button>
        <button class="btn green" onclick="doMarkPaid()">✅ Record Payment</button>
      </div>
    </div>
  </div>`;
}

function mExpense(){
  var opts=db.friends.map(f=>`<option value="${f.id}" ${epayer===f.id?'selected':''}>${f.name}</option>`).join('');
  var isEdit=!!editId;
  var nowDate=new Date();
  var defDate=edate||nowDate.toISOString().split('T')[0];
  var defTime=etime||nowDate.toTimeString().slice(0,5);
  var cats=getCategories().slice().sort((a,b)=>a.localeCompare(b));
  var catOpts=cats.map(c=>`<option value="${c}" ${ecat===c?'selected':''}>${c}</option>`).join('');
  var shareBlocked=esplit==='equal-share'&&db.friends.reduce((s,f)=>s+shareOf(f.id),0)!==db.friends.length;
  var curDefault=ecurrency||userCurrency();
  var curOpts=Object.keys(CURRENCIES).map(c=>`<option value="${c}" ${curDefault===c?'selected':''}>${c} - ${CURRENCY_NAMES[c]}</option>`).join('');

  // ---- SPLIT BOX ----
  var splitBox = '';
  if(esplit==='equal-exclude'){
    var includedCount=db.friends.filter(f=>!equalExcluded[f.id]).length;
    var eaV=parseFloat(eamt)||0;
    var perHead=includedCount>0?eaV/includedCount:0;
    splitBox=`<div class="cbox">
      <div style="font-size:11px;font-weight:700;color:#6b7280;margin-bottom:8px">EXCLUDE FROM SPLIT:</div>
      ${db.friends.map(f=>{
        var excl=!!equalExcluded[f.id];
        return `<div class="crow" style="justify-content:space-between">
          <label style="display:flex;align-items:center;gap:8px;flex:1;cursor:pointer">
            <input type="checkbox" ${excl?'checked':''} onchange="doToggleExclude('${f.id}')"
              style="width:16px;height:16px;accent-color:#d97706;cursor:pointer">
            <span style="${excl?'text-decoration:line-through;color:#9ca3af':'font-weight:600'}">${f.name}</span>
          </label>
          <span style="font-size:12px;color:${excl?'#9ca3af':'#d97706'};font-weight:700;min-width:60px;text-align:right">
            ${excl?'Excluded':`<span id="ea-${f.id}"></span>`}
          </span>
        </div>`;
      }).join('')}
      <div class="ctot" style="margin-top:6px">
        <span style="font-weight:700">Split among:</span>
        <span style="font-weight:900;color:${includedCount>0?'#16a34a':'#ef4444'}">${includedCount} of ${db.friends.length} members</span>
      </div>
    </div>`;
  } else if(esplit==='equal-share'){
    var eaS=parseFloat(eamt)||0;
    var shTot=db.friends.reduce((s,f)=>s+shareOf(f.id),0);
    var perShare=shTot>0?eaS/shTot:0;
    var symS=currencySymbol(ecurrency||userCurrency());
    splitBox=`<div class="cbox">
      <div style="font-size:11px;font-weight:700;color:#6b7280;margin-bottom:8px">SHARES PER PERSON:</div>
      ${db.friends.map(f=>{
        var n=shareOf(f.id);
        var amtF=perShare*n;
        return `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px">
          <span style="font-weight:600;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</span>
          <div style="display:flex;align-items:center;gap:6px">
            <button type="button" class="btn sm secondary" style="padding:3px 10px" onclick="doChangeShare('${f.id}',-1)">−</button>
            <span style="min-width:22px;text-align:center;font-weight:900">${n}</span>
            <button type="button" class="btn sm secondary" style="padding:3px 10px" onclick="doChangeShare('${f.id}',1)">+</button>
            <span id="sa-${f.id}" style="font-size:12px;font-weight:700;color:#d97706;min-width:72px;text-align:right"></span>
          </div>
        </div>`;
      }).join('')}
      <div class="ctot" style="margin-top:6px">
        <span style="font-weight:700">Total shares:</span>
        <span style="font-weight:900;color:${shTot===db.friends.length?'#16a34a':'#ef4444'}">${shTot} of ${db.friends.length}</span>
      </div>
      ${shTot!==db.friends.length?`<div style="font-size:11px;font-weight:700;color:#ef4444;margin-top:6px">⚠️ Total shares must equal ${db.friends.length} (number of members). Adjust the counts to continue.</div>`:''}
    </div>`;
  } else if(esplit==='custom'){
    splitBox=`<div class="cbox">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px">
        <div style="font-size:11px;font-weight:700;color:#6b7280">SPLIT PER PERSON:</div>
        <div style="display:flex;gap:4px">
          <button class="btn sm ${csplitMode==='amount'?'primary':'secondary'}" style="padding:4px 10px;font-size:11px" onclick="doToggleSplitMode('amount')">₹ Amount</button>
          <button class="btn sm ${csplitMode==='percent'?'primary':'secondary'}" style="padding:4px 10px;font-size:11px" onclick="doToggleSplitMode('percent')">% Percent</button>
        </div>
      </div>
      ${db.friends.map(f=>`
      <div class="crow">
        <span>${f.name}</span>
        <div style="display:flex;align-items:center;gap:4px">
          <span id="cr${f.id}" style="font-size:10px;color:#d97706;text-align:right;white-space:nowrap"></span>
          <input id="cs${f.id}" class="ci" type="number" inputmode="decimal"
            placeholder="${csplitMode==='percent'?'0%':'0'}"
            value="${csplits[f.id]||''}" oninput="calcTotal()"
            style="width:${csplitMode==='percent'?'65px':'95px'}">
          ${csplitMode==='percent'?`<span style="color:#6b7280;font-size:12px">%</span>`:''}
        </div>
      </div>`).join('')}
      <div class="ctot">
        <span style="font-weight:700">Total:</span>
        <span id="ctot" style="font-weight:900;color:#ef4444">${csplitMode==='percent'?'0% (need 100%)':'₹0'}</span>
      </div>
    </div>`;
  }

  return `<div class="overlay" onclick="modal=null;editId=null;render()">
    <div class="modal" onclick="event.stopPropagation()">
      <h3>${isEdit?'✏️ Edit Expense':'💸 Add Expense'}</h3>
      <span class="lbl">Description</span>
      <input id="ied" class="f" type="text" placeholder="e.g. Dinner, Hotel" autocomplete="off" value="${edesc}">
      <div style="display:flex;gap:8px">
        <div style="flex:1">
          <span class="lbl">Currency</span>
          <select id="iecur" class="f" style="margin:0" onchange="calcTotal()">
            ${curOpts}
          </select>
        </div>
        <div style="flex:2">
          <span class="lbl">Amount</span>
          <input id="iea" class="f" type="number" inputmode="decimal" placeholder="0" value="${eamt}" oninput="calcTotal()" style="margin:0">
        </div>
      </div>
      <div id="pv-total" style="margin:6px 0 10px;min-height:0"></div>
      <span class="lbl">Who Paid?</span>
      <select id="iep" class="f"><option value="">Select person</option>${opts}</select>
      <span class="lbl">Category</span>
      <select id="iecat" class="f">
        <option value="">— No category —</option>
        ${catOpts}
      </select>
      ${!cats.length&&currentUser.role==='admin'?`<p style="font-size:11px;color:#9ca3af;margin:-4px 0 8px">No categories yet. Add them in 👑 Admin → Categories.</p>`:''}
      ${!cats.length&&currentUser.role!=='admin'?`<p style="font-size:11px;color:#9ca3af;margin:-4px 0 8px">Ask your admin to add categories.</p>`:''}
      <div style="display:flex;gap:8px">
        <div style="flex:1"><span class="lbl">Date</span>
          <input id="iedate" class="f" type="date" value="${defDate}">
        </div>
        <div style="flex:1"><span class="lbl">Time</span>
          <input id="ietime" class="f" type="time" value="${defTime}">
        </div>
      </div>
      <span class="lbl">Split Type</span>
      <div class="stgl" style="flex-wrap:nowrap;gap:5px;margin-bottom:10px">
        <button class="btn sm ${esplit==='equal'?'primary':'secondary'}" style="flex:1;min-width:0;padding:7px 2px;font-size:11px;white-space:nowrap" onclick="doSetSplit('equal')">⚖️ Equal</button>
        <button class="btn sm ${esplit==='equal-exclude'?'primary':'secondary'}" style="flex:1;min-width:0;padding:7px 2px;font-size:11px;white-space:nowrap" onclick="doSetSplit('equal-exclude')">👥 Exclude</button>
        <button class="btn sm ${esplit==='equal-share'?'primary':'secondary'}" style="flex:1;min-width:0;padding:7px 2px;font-size:11px;white-space:nowrap" onclick="doSetSplit('equal-share')">🧮 Share</button>
        <button class="btn sm ${esplit==='custom'?'primary':'secondary'}" style="flex:1;min-width:0;padding:7px 2px;font-size:11px;white-space:nowrap" onclick="doSetSplit('custom')">✏️ Custom</button>
      </div>
      ${splitBox}
      <div class="mbtns">
        <button class="btn secondary" onclick="modal=null;editId=null;render()">Cancel</button>
        <button class="btn primary" onclick="doAddExpense()" ${shareBlocked?'disabled':''} style="${shareBlocked?'opacity:0.5;cursor:not-allowed':''}">${isEdit?'💾 Save':'➕ Add Expense'}</button>
      </div>
    </div>
  </div>`;
}

  var meta=db.meta||{};
  var members=meta.members||[];
  var memberList=members.length
    ?members.map(m=>`<div class="member-row">
        <div class="av" style="width:32px;height:32px;font-size:13px">${initials(m)}</div>
        <span>${m}</span>
        <button class="btn danger sm" onclick="doRevokeAccess('${m}')">Remove</button>
      </div>`).join('')
    :`<p style="font-size:12px;color:#9ca3af;text-align:center;padding:10px 0">No members yet.</p>`;
  var groupOpts=myGroups.length
    ?myGroups.map(g=>`<option value="${g.id}">🫂 ${g.name} (${g.emails.length} members)</option>`).join('')
    :'';
  return `<div class="overlay" onclick="modal=null;render()">
    <div class="modal" onclick="event.stopPropagation()">
      <h3>🔑 Manage Story Access</h3>
      <div style="font-size:12px;color:#6b7280;margin-bottom:12px">Story: <strong>${meta.name||tripId}</strong> · Owner: you</div>
      ${groupOpts?`<span class="lbl">Grant Access to a Group</span>
      <div style="display:flex;gap:7px;margin-bottom:14px">
        <select id="access-group" class="f" style="margin:0;flex:1">
          <option value="">— Select a group —</option>
          ${groupOpts}
        </select>
        <button class="btn primary sm" onclick="var s=document.getElementById('access-group');if(s&&s.value)doGrantGroupAccess(s.value);else toast('Select a group')">Grant</button>
      </div>`:''}
      <span class="lbl">Add Individual by Email</span>
      <div style="display:flex;gap:7px;margin-bottom:14px">
        <input id="access-email" class="f" type="email" placeholder="friend@example.com" style="margin:0;flex:1" onkeydown="if(event.key==='Enter')doGrantAccess()">
        <button class="btn primary sm" onclick="doGrantAccess()">Grant</button>
      </div>
      <span class="lbl">Current Members</span>
      ${memberList}
      <div class="mbtns" style="margin-top:14px">
        <button class="btn secondary" onclick="modal=null;render()">Close</button>
      </div>
    </div>
  </div>`;
}

// ============ PROFILE MODAL ============
function mProfile(){
  return `<div class="overlay" onclick="modal=null;render()">
    <div class="modal" onclick="event.stopPropagation()" style="max-width:360px">
      <h3>👤 My Profile</h3>
      <div style="display:flex;align-items:center;gap:14px;background:#f9fafb;border-radius:12px;padding:14px;margin-bottom:16px">
        <div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#d97706,#ea580c);color:white;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          ${initials(currentUser.displayName)}
        </div>
        <div style="min-width:0">
          <div style="font-weight:900;font-size:16px;color:#1f2937">${currentUser.displayName}</div>
          <div style="font-size:12px;color:#6b7280;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${currentUser.email}</div>
          <div style="font-size:11px;margin-top:3px">${currentUser.role==='admin'?'<span style="background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:20px;font-weight:700;font-size:10px">👑 Admin</span>':'<span style="background:#f3f4f6;color:#6b7280;padding:2px 8px;border-radius:20px;font-weight:700;font-size:10px">👤 User</span>'}</div>
        </div>
      </div>
      <span class="lbl">Display Name</span>
      <input id="profile-name" class="f" type="text" value="${currentUser.displayName}"
        placeholder="Your display name"
        onkeydown="if(event.key==='Enter')doUpdateProfile()">
      <span class="lbl">Preferred Currency</span>
      <select id="profile-currency" class="f">
        ${Object.keys(CURRENCIES).map(c=>`<option value="${c}" ${userCurrency()===c?'selected':''}>${c} - ${CURRENCY_NAMES[c]}</option>`).join('')}
      </select>
      <p style="font-size:11px;color:#9ca3af;margin:-4px 0 12px">All amounts will be converted to your preferred currency</p>
      <div id="profile-msg" style="font-size:12px;min-height:16px;margin:-4px 0 8px"></div>
      <div class="mbtns">
        <button class="btn secondary" onclick="modal=null;render()">Cancel</button>
        <button class="btn primary" onclick="doUpdateProfile()">💾 Save</button>
      </div>
    </div>
  </div>`;
}

async function doUpdateProfile(){
  var name=(document.getElementById('profile-name')||{value:''}).value.trim();
  var newCurrency=(document.getElementById('profile-currency')||{value:''}).value||'INR';
  var msg=document.getElementById('profile-msg');
  if(!name){if(msg)msg.textContent='Name cannot be empty';return;}
  var nameChanged=name!==currentUser.displayName;
  var currencyChanged=newCurrency!==userCurrency();
  if(!nameChanged&&!currencyChanged){modal=null;render();return;}
  if(msg){msg.style.color='#6b7280';msg.textContent='Saving...';}
  var oldName=currentUser.displayName;
  try{
    // 1. Update user record in Firebase /users
    var rec=await faGet(eKey(currentUser.email));
    if(!rec) throw new Error('User not found');
    rec.displayName=name;
    rec.currency=newCurrency;
    await fetch(aurl(eKey(currentUser.email)),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)});

    // 2. Update local currentUser immediately
    currentUser.displayName=name;
    currentUser.currency=newCurrency;
    localStorage.setItem('px-user',JSON.stringify(currentUser));

    // Helper: rename self in a friends array
    function renameFriends(friends){
      var changed=false;
      var result=friends.map(f=>{
        var isMe=f.email===currentUser.email||f.name===oldName;
        if(isMe){changed=true;return{...f,name,email:f.email||currentUser.email};}
        return f;
      });
      return{result,changed};
    }

    // 3. Rename in current open story (db.friends) and save
    if(tripId&&db.friends.length){
      var cur=renameFriends(db.friends);
      if(cur.changed){
        db.friends=cur.result;
        await fbSet(tripId+'/friends',db.friends);
      }
    }

    // 4. Rename in every story in dashData and save each to Firebase
    var savePromises=[];
    if(dashData&&dashData.length){
      dashData.forEach(t=>{
        var r2=renameFriends(t.friends);
        if(r2.changed){
          t.friends=r2.result; // update in-memory immediately
          if(t.id!==tripId){   // already saved tripId above
            savePromises.push(fbSet(t.id+'/friends',t.friends));
          }
        }
      });
    }

    // 5. If dashData wasn't loaded yet, do a full dashboard fetch first then rename
    if(!dashData.length){
      await loadDashboard(); // fetches all stories
      dashData.forEach(t=>{
        var r3=renameFriends(t.friends);
        if(r3.changed){
          t.friends=r3.result;
          if(t.id!==tripId) savePromises.push(fbSet(t.id+'/friends',t.friends));
        }
      });
    }

    await Promise.all(savePromises);

    modal=null;
    toast('✅ Name updated to "'+name+'" across all stories');
    // Reload dashboard so balances recalculate with new name
    dashLoaded=false;
    render();
    loadDashboard();
  }catch(e){
    console.error('Profile update failed:',e);
    if(msg){msg.style.color='#ef4444';msg.textContent='Failed to save. Try again.';}
  }
}

// ============ INIT ============
(function init(){
  initEJS();
  // Restore OTP screen if user closed browser mid-verification/reset
  if(!currentUser && _otpState){
    authMode = _otpState.purpose==='verify' ? 'otp-verify' : 'otp-reset';
    startResendTimer();
  }
  render();
  if(currentUser){
    loadCategories();
    loadGroups();
    try{ var lc=JSON.parse(localStorage.getItem('px-rates')||'null'); if(lc&&lc.rates) applyRates(lc.rates,lc.fetchedAt,lc.date); }catch(e){}
    loadExchangeRates();
    if(tripId){ loadTrip(); loadMemories(); } else loadTrips();
  }
})();
</script>
