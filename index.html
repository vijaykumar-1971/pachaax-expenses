<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
// ============ CONFIG ============
const FB      = 'https://pachaax-expenses-default-rtdb.firebaseio.com/trips';
const FB_AUTH = 'https://pachaax-expenses-default-rtdb.firebaseio.com/users';

// ============ EMAILJS CONFIG ============
// Fill in your EmailJS credentials below — they are baked into the HTML file
// and work seamlessly across all browsers without any setup step.
// Get them from https://emailjs.com → your account dashboard.
const EJS_PUBLIC_KEY  = 'wvK95DlAlD6E7ld7H';   // Account → General → Public Key
const EJS_SERVICE_ID  = 'service_pph2qsj';   // Email Services → your service → Service ID
const EJS_TEMPLATE_ID = 'template_rq1ptiv';  // Email Templates → your template → Template ID
// Template must have "To Email" = {{to_email}}
// Body variables: {{to_name}} {{otp_code}} {{purpose}} {{app_name}}

function getEjsCfg(){
  return { publicKey: EJS_PUBLIC_KEY, serviceId: EJS_SERVICE_ID, templateId: EJS_TEMPLATE_ID };
}
function ejsConfigured(){
  return EJS_PUBLIC_KEY !== 'YOUR_PUBLIC_KEY' && !!EJS_SERVICE_ID && !!EJS_TEMPLATE_ID;
}

// ============ HELPERS ============
function eKey(email){ return email.toLowerCase().replace(/\./g,'__'); }
function eFromKey(k){ return k.replace(/__/g,'.'); }
function isEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function initials(s){ return (s||'?')[0].toUpperCase(); }
function genOtp(){ return String(Math.floor(100000+Math.random()*900000)); }

// ============ EMAILJS ============
function initEJS(){
  var c=getEjsCfg();
  if(!c.publicKey) return;
  try{ emailjs.init({ publicKey: c.publicKey }); }
  catch(e){ console.warn('EmailJS init failed', e); }
}

async function sendOtpEmail(toEmail, toName, otp, purpose){
  var c=getEjsCfg();
  try{
    await emailjs.send(
      c.serviceId,
      c.templateId,
      {
        to_email: toEmail,
        to_name:  toName,
        otp_code: otp,
        purpose:  purpose,
        app_name: 'Expense & Settle'
      },
      { publicKey: c.publicKey }
    );
    return { ok: true };
  }catch(e){
    var msg = (e && (e.text || e.message || JSON.stringify(e))) || 'Unknown error';
    console.error('EmailJS send error:', e);
    return { ok: false, msg };
  }
}

// ============ STATE ============
let tripId      = localStorage.getItem('px-trip') || '';
let db          = { friends:[], expenses:[], settlements:[], meta:{} };
let trips       = [];
let tab         = 'expenses';
let syncing     = false;
let lastSync    = '';
let modal       = null;
let editId      = null;
let fname='', edesc='', eamt='', epayer='', esplit='equal', csplits={}, edate='', etime='', ecat='', ecurrency='';
var csplitMode = 'amount'; // 'amount' | 'percent'
var equalExcluded = {};    // {friendId: true} — excluded from equal-exclude split
var equalShares = {};      // {friendId: number} — share count for equal-share split (default 1)
function shareOf(fid){ return equalShares[fid]!=null ? equalShares[fid] : 1; }

// Capture current form inputs into state so re-rendering does not lose them
function snapshotExpenseForm(){
  var g=id=>document.getElementById(id);
  if(g('ied'))  edesc=g('ied').value;
  if(g('iea'))  eamt=g('iea').value;
  if(g('iep'))  epayer=g('iep').value;
  if(g('iedate'))edate=g('iedate').value;
  if(g('ietime'))etime=g('ietime').value;
  if(g('iecat')) ecat=g('iecat').value;
  if(g('iecur')) ecurrency=g('iecur').value;
}

function doChangeShare(fid, delta){
  snapshotExpenseForm();
  var n=shareOf(fid)+delta;
  if(n<0) n=0;
  if(n>20) n=20;
  equalShares[fid]=n;
  render(); setTimeout(()=>calcTotal(),0);
}

// ============ CURRENCY ============
const CURRENCIES = {
  INR:'₹',  USD:'$',  EUR:'€',  GBP:'£',  SGD:'S$',
  JPY:'¥',  AUD:'A$', CAD:'C$', CHF:'Fr ', THB:'฿',  MYR:'RM ',
  HKD:'HK$',NZD:'NZ$',SEK:'kr ',NOK:'kr ',DKK:'kr '
};
const CURRENCY_NAMES = {
  INR:'Indian Rupee',  USD:'US Dollar',     EUR:'Euro',
  GBP:'British Pound', SGD:'Singapore Dollar', AED:'UAE Dirham',
  JPY:'Japanese Yen',  AUD:'Australian Dollar', CAD:'Canadian Dollar',
  CHF:'Swiss Franc',   THB:'Thai Baht',     MYR:'Malaysian Ringgit',
  HKD:'Hong Kong Dollar', NZD:'New Zealand Dollar',
  SEK:'Swedish Krona', NOK:'Norwegian Krone', DKK:'Danish Krone'
};

var exchangeRates = {};  // {USD: rate_from_INR, EUR: ...} — all relative to INR as base
var ratesLoadedAt = 0;   // timestamp
var ratesLoading  = false;

function userCurrency(){ return (currentUser&&currentUser.currency)||'INR'; }

function currencySymbol(c){ return CURRENCIES[c]||c+' '; }

// Convert amount from one currency to another using cached rates (base = INR)
function convertAmt(amount, fromCur, toCur){
  fromCur=fromCur||'INR'; toCur=toCur||userCurrency();
  if(fromCur===toCur) return amount;
  if(!Object.keys(exchangeRates).length) return amount; // no rates yet, show as-is
  // Convert to INR first, then to target
  var toINR = fromCur==='INR' ? amount : amount / (exchangeRates[fromCur]||1);
  return toCur==='INR' ? toINR : toINR * (exchangeRates[toCur]||1);
}

// Format an amount in user's preferred currency
function fmt(amount, fromCur){
  var converted=convertAmt(amount, fromCur||'INR', userCurrency());
  var sym=currencySymbol(userCurrency());
  // Use locale formatting; for JPY no decimals
  var uc=userCurrency();
  var decimals=(uc==='JPY')?0:(converted<100?2:0);
  return sym+converted.toLocaleString('en-IN',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
}

// ---- Preferred-currency preview (Add/Edit Expense) ----
function prefRateText(cur){
  var pref=userCurrency();
  return '1 '+cur+' = '+currencySymbol(pref)+convertAmt(1,cur,pref).toFixed(2);
}
function prefNote(v,cur){
  var pref=userCurrency();
  if(!(v>0)||cur===pref||!Object.keys(exchangeRates).length) return '';
  return ' <span style="color:#16a34a;font-size:10px;font-weight:700">≈ '+currencySymbol(pref)+Math.round(convertAmt(v,cur,pref)).toLocaleString('en-IN')+'</span>';
}
function refreshSplitPreview(){
  var amtV=parseFloat((document.getElementById('iea')||{value:''}).value)||0;
  var curEl=document.getElementById('iecur');
  var cur=(curEl&&curEl.value)||ecurrency||userCurrency();

// ---- Exchange rates: fetched once per day, shared via Firebase, cached locally ----
const FB_RATES = 'https://pachaax-expenses-default-rtdb.firebaseio.com/app_rates.json';
// Tried in order; all are free, need no key, and return {rates:{USD:..,...}} relative to INR
const RATE_SOURCES = [
  'https://open.er-api.com/v6/latest/INR',
  'https://api.frankfurter.dev/v1/latest?base=INR',
  'https://api.frankfurter.app/latest?from=INR'
];
var ratesDate = '';  // YYYY-MM-DD of the rates currently in use

function todayStr(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function applyRates(rates, fetchedAt, date){
  exchangeRates=rates;
  ratesLoadedAt=fetchedAt||Date.now();
  ratesDate=date||todayStr();
  try{ localStorage.setItem('px-rates', JSON.stringify({rates, fetchedAt:ratesLoadedAt, date:ratesDate})); }catch(e){}
}

async function fetchRatesFromSources(){
  for(var u of RATE_SOURCES){
    try{
      var r=await fetch(u);
      if(!r.ok) continue;
      var d=await r.json();
      if(d&&d.rates&&d.rates.USD) return {rates:d.rates, source:u};
    }catch(e){ /* try next source */ }
  }
  return null;
}

async function loadExchangeRates(force){
  if(ratesLoading) return;
  ratesLoading=true;
  try{
    var today=todayStr();

    // 1. Use rates already in memory if they are from today
    if(!force && ratesDate===today && Object.keys(exchangeRates).length){ return; }

    // 2. Shared copy in Firebase (fetched by anyone today)
    var stored=null;
    try{ var sr=await fetch(FB_RATES); stored=sr.ok?await sr.json():null; }catch(e){}
    if(!force && stored && stored.date===today && stored.rates){
      applyRates(stored.rates, stored.fetchedAt, stored.date); return;
    }

    // 3. Fetch fresh rates and store them for everyone
    var fresh=await fetchRatesFromSources();
    if(fresh){
      applyRates(fresh.rates, Date.now(), today);
      try{
        await fetch(FB_RATES,{method:'PUT',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({date:today, rates:fresh.rates, fetchedAt:ratesLoadedAt, source:fresh.source})});
      }catch(e){}
      return;
    }

    // 4. Offline or all sources down: use the newest copy we have (Firebase or this browser)
    var local=null;
    try{ local=JSON.parse(localStorage.getItem('px-rates')||'null'); }catch(e){}
    var best=null;
    if(stored&&stored.rates) best={rates:stored.rates, fetchedAt:stored.fetchedAt, date:stored.date};
    if(local&&local.rates&&(!best||(local.fetchedAt||0)>(best.fetchedAt||0))) best=local;
    if(best && !Object.keys(exchangeRates).length) applyRates(best.rates, best.fetchedAt, best.date);
  }catch(e){ console.warn('Exchange rate load failed',e); }
  finally{
    ratesLoading=false;
    // Don't wipe an open form; just refresh the preview if it is open
    if(modal==='expense') refreshSplitPreview(); else render();
  }
}

// Check once every 15 minutes whether the day has changed, and refresh rates if so
setInterval(()=>{
  if(currentUser && ratesDate!==todayStr()) loadExchangeRates();
},15*60*1000);

// ============ HASH ============
async function hashPwd(pwd){
  var enc=new TextEncoder().encode(pwd);
  var buf=await crypto.subtle.digest('SHA-256',enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function doRegister(){
  var u=(document.getElementById('au')||{value:''}).value.trim().toLowerCase();
  var dn=(document.getElementById('adn')||{value:''}).value.trim();
  var p=(document.getElementById('ap')||{value:''}).value;
  var p2=(document.getElementById('ap2')||{value:''}).value;
  authErr=''; authOk=''; authLoading=true; render();
  if(!u||!dn||!p||!p2){ authErr='Please fill all fields.'; authLoading=false; render(); return; }
  if(!isEmail(u)){ authErr='Username must be a valid email address.'; authLoading=false; render(); return; }
  if(p.length<6){ authErr='Password must be at least 6 characters.'; authLoading=false; render(); return; }
  if(p!==p2){ authErr='Passwords do not match.'; authLoading=false; render(); return; }
  try{
    var existing=await faGet(eKey(u));
    if(existing && existing.verified){ authErr='An account with this email already exists.'; authLoading=false; render(); return; }
    var allR=await fetch(FB_AUTH+'.json?shallow=true'); var allD=await allR.json();
    var isFirst=!allD||Object.keys(allD).length===0;
    var h=await hashPwd(p);
    var otp=genOtp();
    // Save user as unverified — verified=true only after OTP confirmed
    await faSet(eKey(u),{
      passwordHash:h, role:isFirst?'admin':'user', displayName:dn,
      banned:false, verified:false, createdAt:new Date().toISOString()
    });
    saveOtpState({ email:u, displayName:dn, role:isFirst?'admin':'user', otp, sentAt:Date.now(), purpose:'verify' });
    var result=await sendOtpEmail(u, dn, otp, 'Email Verification');
    authLoading=false;
    if(!result.ok){
      // Delete the unverified record so the user can try registering again
      await faDel(eKey(u));
      clearOtpState();
      authErr='Could not send verification email: ' + result.msg
        + '. Check that your EmailJS Service ID, Template ID, and Public Key are correct.';
      render(); return;
    }
    authMode='otp-verify'; render();
    startResendTimer();
    toast('📧 OTP sent to '+u);
  }catch(e){ authErr='Connection error. Please try again.'; authLoading=false; render(); }
}

// ============ CALC ============

// Raw expense balances (who paid vs who owes from expenses only)
function balances(){
  var b={};
  db.friends.forEach(f=>b[f.id]=0);
  db.expenses.forEach(e=>{
    var cur=e.currency||'INR';
    var convertedAmt=convertAmt(e.amount,cur,userCurrency());
    b[e.paidBy]=(b[e.paidBy]||0)+convertedAmt;
    Object.entries(e.splitAmong).forEach(([id,a])=>{
      var convertedSplit=convertAmt(a,cur,userCurrency());
      b[id]=(b[id]||0)-convertedSplit;
    });
  });
  return b;
}

// Normalize all settlement records to {fromId, toId, amount, paidAt}
// Handles every historical format we've ever stored
function normSettlements(){
  return (db.settlements||[]).map(s=>{
    if(typeof s==='string'){
      var p=s.split('-');
      return {fromId:p[0], toId:p.slice(1).join('-'), amount:null, paidAt:null};
    }
    if(s.key&&s.fromId===undefined){
      var kp=s.key.split('-');
      return {fromId:kp[0], toId:kp.slice(1).join('-'), amount:s.amount||0, paidAt:s.paidAt||null};
    }
    return {fromId:s.fromId||'', toId:s.toId||'', amount:s.amount||0, paidAt:s.paidAt||null};
  }).filter(s=>s.fromId&&s.toId&&s.amount>0);
}

// NET balances = expense balances adjusted for all cash payments made.
// Each payment {fromId→toId, amount} means: fromId has paid out, toId has received.
// fromId balance += amount (owes less / gets back more)
// toId   balance -= amount (gets back less / owes more)
function netBalances(){
  var b=balances();
  normSettlements().forEach(s=>{
    b[s.fromId]=(b[s.fromId]||0)+s.amount;
    b[s.toId]  =(b[s.toId]  ||0)-s.amount;
  });
  return b;
}

// Compute minimum transfers to settle net positions.
// Returns [{from, to, amount}] — remaining debts after all payments.
function minTransfers(bals){
  var debt=[],cred=[];
  Object.entries(bals).forEach(([id,v])=>{
    if(v<-0.01)debt.push({id,a:-v});
    else if(v>0.01)cred.push({id,a:v});
  });
  debt.sort((a,z)=>a.id.localeCompare(z.id));
  cred.sort((a,z)=>a.id.localeCompare(z.id));
  var res=[], i=0, j=0;
  while(i<debt.length&&j<cred.length){
    var d=debt[i], c=cred[j], amt=Math.min(d.a,c.a);
    if(amt>0.01) res.push({from:d.id, to:c.id, amount:amt});
    d.a-=amt; c.a-=amt;
    if(d.a<0.01)i++; if(c.a<0.01)j++;
  }
  return res;
}

// Main settlements() for the Settle Up tab UI.
// "amount" = original debt from expenses alone (for context).
// "remaining" = what's left after all payments (from net balances).
function settlements(){
  var rawB=balances(), netB=netBalances();
  var rawDebt=[],rawCred=[];
  Object.entries(rawB).forEach(([id,v])=>{
    if(v<-0.01)rawDebt.push({id,a:-v});
    else if(v>0.01)rawCred.push({id,a:v});
  });
  rawDebt.sort((a,z)=>a.id.localeCompare(z.id));
  rawCred.sort((a,z)=>a.id.localeCompare(z.id));
  // Build original debt pairs (for showing "original amount" in UI)
  var origPairs=[];
  var di=rawDebt.map(x=>({...x})), ci=rawCred.map(x=>({...x}));
  var ii=0, jj=0;
  while(ii<di.length&&jj<ci.length){
    var d=di[ii], c=ci[jj], amt=Math.min(d.a,c.a);
    origPairs.push({from:d.id, to:c.id, origAmt:amt});
    d.a-=amt; c.a-=amt;
    if(d.a<0.01)ii++; if(c.a<0.01)jj++;
  }
  // Compute remaining transfers from net balances
  var remaining=minTransfers(netB);
  var pmts=normSettlements();
  // Build result: for each remaining debt, find matching original pair for context
  var res=remaining.map(r=>{
    var orig=origPairs.find(p=>p.from===r.from&&p.to===r.to);
    var paid=pmts.filter(p=>p.fromId===r.from&&p.toId===r.to).reduce((s,p)=>s+p.amount,0);
    return {
      from:r.from, to:r.to,
      amount: orig?orig.origAmt:r.amount, // original owed (for display)
      remaining: r.amount,
      totalPaid: paid,
      payments: pmts.filter(p=>p.fromId===r.from&&p.toId===r.to),
      fullyPaid: false,
      key:r.from+'-'+r.to
    };
  });
  // Add fully-settled pairs that no longer appear in remaining transfers
  origPairs.forEach(op=>{
    if(!res.find(r=>r.from===op.from&&r.to===op.to)){
      var paid=pmts.filter(p=>p.fromId===op.from&&p.toId===op.to).reduce((s,p)=>s+p.amount,0);
      if(paid>0.01){
        res.push({
          from:op.from, to:op.to,
          amount:op.origAmt, remaining:0,
          totalPaid:paid,
          payments:pmts.filter(p=>p.fromId===op.from&&p.toId===op.to),
          fullyPaid:true,
          key:op.from+'-'+op.to
        });
      }
    }
  });
  return res;
}

// Current Balances = remaining position from net balances
function settledBalances(){
  var nb=netBalances(), sb={};
  db.friends.forEach(f=>sb[f.id]=0);
  Object.entries(nb).forEach(([id,v])=>{ sb[id]=v; });
  return sb;
}

// Dashboard calc helpers (work on arbitrary trip data, not global db)
function tripBalances(t){
  var b={};
  t.friends.forEach(f=>b[f.id]=0);
  t.expenses.forEach(e=>{
    var cur=e.currency||'INR';
    var convertedAmt=convertAmt(e.amount,cur,userCurrency());
    b[e.paidBy]=(b[e.paidBy]||0)+convertedAmt;
    Object.entries(e.splitAmong||{}).forEach(([id,a])=>{
      var convertedSplit=convertAmt(a,cur,userCurrency());
      b[id]=(b[id]||0)-convertedSplit;
    });
  });
  return b;
}
// Normalize trip settlements using the same logic as normSettlements
function normTripSettlements(t){
  return (t.settlements||[]).map(s=>{
    if(typeof s==='string'){var p=s.split('-');return{fromId:p[0],toId:p.slice(1).join('-'),amount:null};}
    if(s.key&&s.fromId===undefined){var kp=s.key.split('-');return{fromId:kp[0],toId:kp.slice(1).join('-'),amount:s.amount||0};}
    return{fromId:s.fromId||'',toId:s.toId||'',amount:s.amount||0};
  }).filter(s=>s.fromId&&s.toId&&s.amount>0);
}

function tripNetBalances(t){
  var b=tripBalances(t);
  normTripSettlements(t).forEach(s=>{
    b[s.fromId]=(b[s.fromId]||0)+s.amount;
    b[s.toId]  =(b[s.toId]  ||0)-s.amount;
  });
  return b;
}

// Remaining owe/get-back for one person in a story
function tripPersonalBalance(t, friendId){
  var nb=tripNetBalances(t);
  var owes=0, getsBack=0;
  // Run minTransfers on the net balances to get remaining transfers
  var debt=[],cred=[];
  Object.entries(nb).forEach(([id,v])=>{
    if(v<-0.01)debt.push({id,a:-v});
    else if(v>0.01)cred.push({id,a:v});
  });
  debt.sort((a,z)=>a.id.localeCompare(z.id));
  cred.sort((a,z)=>a.id.localeCompare(z.id));
  var i=0,j=0;
  while(i<debt.length&&j<cred.length){
    var d=debt[i],c=cred[j],amt=Math.min(d.a,c.a);
    if(d.id===friendId) owes+=amt;
    if(c.id===friendId) getsBack+=amt;
    d.a-=amt;c.a-=amt;
    if(d.a<0.01)i++;if(c.a<0.01)j++;
  }
  return {owes, getsBack};
}

// Total still-pending settlement amount for a story
function tripSettlementStatus(t){
  var nb=tripNetBalances(t);
  var debt=[];
  Object.entries(nb).forEach(([id,v])=>{if(v<-0.01)debt.push(-v);});
  // pending = sum of remaining debts (= sum of remaining credits, same value)
  return debt.reduce((s,v)=>s+v,0);
}

  }

  render();await saveTrip();
}

    if(el){el.textContent=Math.round(totPct)+'%'+(match?' ✅':' (need 100%)');el.style.color=match?'#16a34a':'#ef4444';}
  }else{
    var tot=0;
    db.friends.forEach(f=>{var el=document.getElementById('cs'+f.id);if(el)tot+=parseFloat(el.value)||0;});
    var match2=ea>0&&Math.abs(tot-ea)<0.01;
    var el2=document.getElementById('ctot');
    if(el2){el2.textContent='₹'+Math.round(tot)+(match2?' ✅':ea>0?' (need ₹'+Math.round(ea)+')':'');el2.style.color=match2?'#16a34a':'#ef4444';}
  }
}

const FB_GROUPS = 'https://pachaax-expenses-default-rtdb.firebaseio.com/app_groups';

function groupsKey(){ return eKey(currentUser.email); }

async function loadGroups(){
  try{
    var r=await fetch(FB_GROUPS+'/'+groupsKey()+'.json');
    var d=r.ok?await r.json():null;
    myGroups=d?Object.values(d).filter(Boolean):[];
  }catch(e){myGroups=[];}
  groupsLoaded=true;
}

async function saveGroups(){
  var obj={};
  myGroups.forEach(g=>obj[g.id]=g);
  await fetch(FB_GROUPS+'/'+groupsKey()+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});
}

async function doSaveGroup(){
  var name=(document.getElementById('grp-name')||{value:''}).value.trim();
  var emailsRaw=(document.getElementById('grp-emails')||{value:''}).value.trim();
  if(!name){toast('Enter a group name');return;}
  var emails=emailsRaw.split(/[\s,;]+/).map(e=>e.trim().toLowerCase()).filter(e=>isEmail(e));
  if(!emails.length){toast('Enter at least one valid email');return;}
  if(editGroupId){
    var idx=myGroups.findIndex(g=>g.id===editGroupId);
    if(idx!==-1) myGroups[idx]={...myGroups[idx],name,emails};
    toast('✅ Group updated');
  }else{
    myGroups.push({id:'g'+Date.now(),name,emails});
    toast('✅ Group created');
  }
  await saveGroups();
  editGroupId=null; modal=null; render();
}

async function doDelGroup(id){
  warnConfirm('Delete this group? Story access already granted will not be removed.', async function(){
    myGroups=myGroups.filter(g=>g.id!==id);
    await saveGroups();
    toast('🗑️ Group deleted'); render();
  },'Delete');
}

async function doGrantGroupAccess(groupId){
  var g=myGroups.find(x=>x.id===groupId);
  if(!g||!g.emails.length){toast('Group has no members');return;}
  var accessAdded=0, friendsAdded=0, skipped=0;
  var members=db.meta.members||[];

  for(var email of g.emails){
    if(email===currentUser.email){skipped++;continue;}
    // Lookup the user in Firebase to get their display name
    var displayName=email; // fallback: use email as name
    try{
      var rec=await faGet(eKey(email));
      if(rec&&rec.verified) displayName=rec.displayName||email;
    }catch(e){}

    // Grant story access (meta.members)
    if(!members.includes(email)){ members.push(email); accessAdded++; }

    // Add as friend if not already in friends list
    var alreadyFriend=db.friends.some(f=>
      f.email===email || f.name===displayName || f.name===email
    );
    if(!alreadyFriend){
      db.friends.push({id:'f'+Date.now()+'_'+Math.random().toString(36).slice(2), name:displayName, email});
      friendsAdded++;
    }
  }

  db.meta.members=members;
  // Save meta and friends separately — never PUT the whole trip (would delete memories)
  await fbSet(tripId+'/meta', db.meta);
  if(friendsAdded>0) await fbSet(tripId+'/friends', db.friends);
  toast('✅ '+(accessAdded?accessAdded+' access granted':'Access updated')+(friendsAdded?' · '+friendsAdded+' friends added':''));
  render();
}

async function loadMemories(){
  try{
    var r=await fbGet(tripId+'/memories');
    memories=r?Object.values(r).filter(Boolean).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)):[];

async function doAddMemory(){
  // Read value BEFORE any async work to avoid losing it
  var el=document.getElementById('mem-text');
  var txt=el?el.value.trim():'';
  if(!txt){toast('Write something first!');return;}
  if(txt.length>2000){toast('Too long — max 2000 characters');return;}
  // Disable button to prevent double-submit
  var btn=document.getElementById('mem-save-btn');
  if(btn){btn.disabled=true;btn.textContent='💾 Saving...';}
  var m={id:'m'+Date.now(),text:txt,author:currentUser.displayName,authorEmail:currentUser.email,createdAt:new Date().toISOString()};
  try{
    await fetch(url(tripId+'/memories/'+m.id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(m)});
    memories.unshift(m);
    if(el) el.value='';
    // Update only the memories list in-place — don't call render() which would wipe textarea
    var listEl=document.getElementById('mem-list');
    if(listEl) listEl.innerHTML=renderMemoryCards();
    else render();
    // Re-enable the button (it stays in the DOM since we didn't re-render the input box)
    var btn2=document.getElementById('mem-save-btn');
    if(btn2){btn2.disabled=false;btn2.textContent='💾 Save Memory';}
    toast('📝 Memory saved!');
  }catch(e){
    toast('⚠️ Save failed, try again');
    var btn2=document.getElementById('mem-save-btn');
    if(btn2){btn2.disabled=false;btn2.textContent='💾 Save Memory';}
  }
}

async function doSaveEditMemory(){

function copyText(text){

    var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('📋 Copied!');

    ${totalPlanned>0?`<div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.25)">

      </div>
      <div style="background:rgba(255,255,255,0.25);border-radius:20px;height:6px;overflow:hidden">

      </div>

          </div>
          <button class="ebtn" onclick="doEditExpense('${e.id}')">✏️</button>

function tabBudget(){
  var cats=getCategories().slice().sort((a,b)=>a.localeCompare(b));
  var catBudgets=db.meta.categoryBudgets||{};
  var totalPlanned=Object.values(catBudgets).reduce((s,v)=>s+(parseFloat(v)||0),0);

  // Compute actual spend per category
  var actuals={};
  var uncatTotal=0;
  db.expenses.forEach(e=>{
    var c=e.category||'';
    if(c){ actuals[c]=(actuals[c]||0)+e.amount; }
    else  { uncatTotal+=e.amount; }
  });
  var totalActual=db.expenses.reduce((s,e)=>s+e.amount,0);

  if(!cats.length){
    return `<div class="empty">
      <p>No categories yet.</p>
      <p style="font-size:12px;color:#9ca3af;margin-top:4px">Ask your admin to add categories in 👑 Admin → Categories, then set budgets here.</p>
    </div>`;
  }

  var canEdit=isOwner(db.meta)||currentUser.role==='admin';

  var h=`<div style="background:linear-gradient(90deg,#d97706,#ea580c);color:white;border-radius:12px;padding:12px 14px;margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-size:11px;font-weight:700;opacity:0.85">BUDGET OVERVIEW</div>
      <div style="font-size:11px;opacity:0.7">Planned vs Actual</div></div>
      <div style="text-align:right">
        <div style="font-size:13px;font-weight:900">₹${Math.round(totalActual).toLocaleString()} spent</div>
        ${totalPlanned>0?`<div style="font-size:11px;opacity:0.8">of ₹${Math.round(totalPlanned).toLocaleString()} planned</div>`:'<div style="font-size:11px;opacity:0.7">No budget set</div>'}
      </div>
    </div>
    ${totalPlanned>0?`<div style="margin-top:8px;background:rgba(255,255,255,0.25);border-radius:20px;height:6px;overflow:hidden">
      <div style="background:${totalActual>totalPlanned?'#ef4444':'#86efac'};height:100%;width:${Math.min(100,Math.round(totalActual/totalPlanned*100))}%;border-radius:20px;transition:width 0.3s"></div>
    </div>`:''}
  </div>`;

  // Per-category grid
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">`;
  h+=cats.map(cat=>{
    var planned=parseFloat(catBudgets[cat])||0;
    var actual=actuals[cat]||0;
    var over=planned>0&&actual>planned;
    var pct=planned>0?Math.min(100,Math.round(actual/planned*100)):0;
    return `<div style="background:white;border-radius:12px;padding:12px;box-shadow:0 2px 6px rgba(0,0,0,0.07);border:2px solid ${over?'#fca5a5':'#e5e7eb'}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
        <span style="background:#ede9fe;color:#6d28d9;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;display:inline-block;max-width:calc(100% - 30px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">🏷️ ${cat}</span>
        ${canEdit?`<button onclick="openSetBudget('${cat}')" style="background:none;color:#9ca3af;font-size:14px;padding:0;line-height:1" title="Set budget">✏️</button>`:''}
      </div>
      <div style="font-weight:900;font-size:17px;color:${over?'#ef4444':actual>0?'#d97706':'#9ca3af'}">₹${Math.round(actual).toLocaleString()}</div>
      <div style="font-size:10px;color:#9ca3af;margin-top:2px">of ${planned>0?'₹'+Math.round(planned).toLocaleString():'no budget'}</div>
      ${planned>0?`<div style="margin-top:6px;background:#f3f4f6;border-radius:20px;height:5px;overflow:hidden">
        <div style="background:${over?'#ef4444':'#d97706'};height:100%;width:${pct}%;border-radius:20px"></div>
      </div>
      <div style="font-size:10px;font-weight:700;margin-top:3px;color:${over?'#ef4444':'#16a34a'}">${over?'⚠️ Over ₹'+Math.round(actual-planned).toLocaleString():'₹'+Math.round(planned-actual).toLocaleString()+' left'}</div>`:''}
    </div>`;
  }).join('');
  h+=`</div>`;

  // Uncategorised
  if(uncatTotal>0.01){
    h+=`<div class="card" style="border-color:#e5e7eb;background:#f9fafb">
      <div style="display:flex;justify-content:space-between;font-size:12px">
        <span style="color:#6b7280;font-weight:700">📦 Uncategorised</span>
        <span style="font-weight:900;color:#d97706">₹${Math.round(uncatTotal).toLocaleString()}</span>
      </div>
    </div>`;
  }

  return h;
}

function tabSet(bal,sets){
  if(!db.friends.length) return `<div class="empty"><p>Add friends first!</p></div>`;
  if(!db.expenses.length) return `<div class="empty"><p>No expenses yet!</p></div>`;

  var pending=sets.filter(s=>!s.fullyPaid);
  var done   =sets.filter(s=> s.fullyPaid);

  // ---- BALANCES (remaining after accounting for payments already made) ----
  var effBal=settledBalances();
  var sym=currencySymbol(userCurrency());
  var h=`<div class="btbl"><div style="font-weight:900;font-size:15px;margin-bottom:10px">Current Balances</div>`;
  h+=db.friends.map(f=>{
    var b=effBal[f.id]||0,cls=b>0.01?'pos':b<-0.01?'neg':'zero';
    var txt=b>0.01?`+${sym}${Math.round(b)}`:b<-0.01?`-${sym}${Math.round(-b)}`:sym+'0';
    return `<div class="brow"><span style="font-weight:700">${f.name}</span><span class="${cls}">${txt}</span></div>`;
  }).join('');
  h+=`</div>`;

  // ---- PENDING PAYMENTS ----
  h+=`<div class="gbox" style="margin-bottom:12px">
    <h3>💳 Payments to Make${pending.length?` <span style="background:#ef4444;color:white;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700">${pending.length}</span>`:''}</h3>`;

  if(!pending.length){
    h+=`<p style="text-align:center;color:#16a34a;font-weight:700;padding:14px 0">🎉 All settled up!</p>`;
  }else{
    h+=pending.map(s=>{
      var partial=s.totalPaid>0;
      var html=`<div class="sc" style="${partial?'border:2px solid #fde047;background:#fefce8;':''}">
        <div class="srow">
          <div>
            <div style="font-weight:700;font-size:13px">${gname(s.from)} → ${gname(s.to)}</div>
            ${partial?`<div style="font-size:11px;color:#92400e;margin-top:2px">
              Paid so far: <strong>${sym}${Math.round(s.totalPaid)}</strong> · Remaining: <strong style="color:#ef4444">${sym}${Math.round(s.remaining)}</strong>
            </div>`:''}
          </div>
          <div style="text-align:right">
            <div style="font-weight:900;font-size:17px;color:${partial?'#d97706':'#16a34a'}">${sym}${Math.round(s.remaining)}</div>
            ${partial?`<div style="font-size:10px;color:#9ca3af">of ${sym}${Math.round(s.amount)}</div>`:''}
          </div>
        </div>
        <div class="sbtns">
          <a href="${upi(gname(s.to),s.remaining)}" class="btn purple sm" style="flex:1">💳 Pay UPI</a>
          <button class="btn green sm" onclick="openMarkPaid('${s.from}','${s.to}',${s.remaining})" style="flex:1">✅ Mark Paid</button>
        </div>
      </div>`;
      return html;
    }).join('');
  }
  h+=`</div>`;

  // ---- PAYMENT HISTORY (flat log — all cash transfers ever recorded) ----
  var allPmts=normSettlements();
  if(allPmts.length){
    h+=`<div style="background:white;border-radius:12px;padding:14px;box-shadow:0 2px 6px rgba(0,0,0,0.07);border:2px solid #e5e7eb">
      <div style="font-size:13px;font-weight:900;color:#374151;margin-bottom:12px;display:flex;align-items:center;gap:8px">
        🕐 Payment History
        <span style="background:#f0fdf4;color:#16a34a;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700">${allPmts.length} payment${allPmts.length!==1?'s':''}</span>
      </div>`;
    allPmts.forEach((p,gi)=>{
      var dt=p.paidAt?new Date(p.paidAt).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}):'—';
      h+=`<div class="pay-entry">
        <span style="font-size:15px">💸</span>
        <div style="flex:1">
          <div style="font-weight:700;color:#15803d;font-size:12px">${gname(p.fromId)} → ${gname(p.toId)}: ₹${Math.round(p.amount)}</div>
          <div style="color:#6b7280;font-size:10px">🕐 ${dt}</div>
        </div>
        <button onclick="doRemovePayment(${gi})" style="background:#fef9c3;color:#92400e;border-radius:7px;padding:4px 9px;font-size:11px;font-weight:700">↩️ Undo</button>
      </div>`;
    });
    h+=`</div>`;
  }

  return h;
}

function csvEscape(v){
  var s=String(v==null?'':v);
  if(s.includes(',')||s.includes('"')||s.includes('\n')) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}

function generateCSV(t){
  var b=tripBalances(t);
  var rows=[];

  // ── Sheet 1: STORY INFO (as header block) ──
  rows.push(['STORY REPORT']);
  rows.push(['Story Name', t.name]);
  rows.push(['Purpose', (t.meta&&t.meta.purpose)||'']);
  rows.push(['Start Date', t.date?new Date(t.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'']);
  var total=t.expenses.reduce((s,e)=>s+e.amount,0);
  var budget=parseFloat((t.meta&&t.meta.budget)||0);
  var pending=tripSettlementStatus(t);
  rows.push(['Total Spent', Math.round(total)]);
  if(budget>0){
    rows.push(['Budget', Math.round(budget)]);
    rows.push([total>budget?'Over Budget':'Remaining', Math.round(Math.abs(budget-total))]);
  }
  rows.push(['Pending Settlement', Math.round(pending)]);
  rows.push([]);

  // ── Itemized Expenses ──
  rows.push(['ITEMIZED EXPENSES']);
  rows.push(['#','Description','Category','Amount (₹)','Paid By','Split Among','Date','Time']);
  var byDate=[...t.expenses].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  byDate.forEach((e,i)=>{
    var paidBy=t.friends.find(f=>f.id===e.paidBy);
    var splitNames=Object.entries(e.splitAmong||{})
      .filter(([,a])=>a>0)
      .map(([id,a])=>{var f=t.friends.find(x=>x.id===id);return (f?f.name:id)+': ₹'+Math.round(a);})
      .join(' | ');
    var dt=e.date?new Date(e.date):'';
    var dateStr=dt?dt.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';
    var timeStr=dt?dt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}):'';
    rows.push([i+1, e.description, e.category||'', Math.round(e.amount), paidBy?paidBy.name:'', splitNames, dateStr, timeStr]);
  });
  rows.push([]);

  // ── Balances (net after payments) ──
  rows.push(['MEMBER BALANCES']);
  rows.push(['Member','Balance (₹)','Status']);
  var nb=tripNetBalances(t);
  t.friends.forEach(f=>{
    var v=nb[f.id]||0;
    rows.push([f.name, Math.round(Math.abs(v)), v>0.01?'Gets back ₹'+Math.round(v):v<-0.01?'Owes ₹'+Math.round(-v):'Settled ✓']);
  });
  rows.push([]);

  // ── Settle Up (remaining transfers from net balances) ──
  rows.push(['SETTLE UP PAYMENTS']);
  rows.push(['From','To','Remaining (₹)','Total Paid (₹)','Status']);
  var remaining2=minTransfers(tripNetBalances(t));
  var rawB2=tripBalances(t), rawDebt2=[], rawCred2=[];
  Object.entries(rawB2).forEach(([id,v])=>{if(v<-0.01)rawDebt2.push({id,a:-v});else if(v>0.01)rawCred2.push({id,a:v});});
  rawDebt2.sort((a,z)=>a.id.localeCompare(z.id)); rawCred2.sort((a,z)=>a.id.localeCompare(z.id));
  var ts2=normTripSettlements(t);
  // Show remaining
  remaining2.forEach(r=>{
    var fn=(t.friends.find(f=>f.id===r.from)||{name:r.from}).name;
    var tn=(t.friends.find(f=>f.id===r.to)||{name:r.to}).name;
    var paid2=ts2.filter(p=>p.fromId===r.from&&p.toId===r.to).reduce((s,p)=>s+p.amount,0);
    rows.push([fn,tn,Math.round(r.amount),Math.round(paid2),'Pending']);
  });
  // Show fully settled (in normTripSettlements but not in remaining)
  var allFromTo=new Set(remaining2.map(r=>r.from+'-'+r.to));
  var seenPairs=new Set();
  ts2.forEach(p=>{
    var pk=p.fromId+'-'+p.toId;
    if(!allFromTo.has(pk)&&!seenPairs.has(pk)){
      seenPairs.add(pk);
      var fn=(t.friends.find(f=>f.id===p.fromId)||{name:p.fromId}).name;
      var tn=(t.friends.find(f=>f.id===p.toId)||{name:p.toId}).name;
      var paid3=ts2.filter(x=>x.fromId===p.fromId&&x.toId===p.toId).reduce((s,x)=>s+x.amount,0);
      rows.push([fn,tn,0,Math.round(paid3),'Fully Settled']);
    }
  });
  rows.push([]);
  rows.push(['Generated by Expense & Settle', '', new Date().toLocaleString('en-IN')]);

  return rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
}

  var pending=tripSettlementStatus(t);

  var ts=normTripSettlements(t);
  var lines=[];

  lines.push('*📖 '+t.name+'*');

  lines.push('Spent: ₹'+Math.round(total).toLocaleString()+' | Pending: ₹'+Math.round(pending).toLocaleString()+' | Expenses: '+t.expenses.length);

  var remaining=minTransfers(tripNetBalances(t)).filter(r=>r.amount>0.01);
  if(remaining.length){
    lines.push('');
    lines.push('💳 Settle Up');
    remaining.forEach(r=>{
      var fn=(t.friends.find(f=>f.id===r.from)||{name:r.from}).name;
      var tn=(t.friends.find(f=>f.id===r.to  )||{name:r.to  }).name;
      var paid=ts.filter(p=>p.fromId===r.from&&p.toId===r.to).reduce((s,p)=>s+p.amount,0);
      var totalOwed=r.amount+paid;
      lines.push('• '+fn+' → '+tn+': ₹'+Math.round(r.amount).toLocaleString()+' / ₹'+Math.round(totalOwed).toLocaleString());
    });
    lines.push('');
    lines.push('(Open the attached file to Pay via UPI)');
  }

  return lines.join('\n');
}

function downloadFile(filename, content, mimeType){
  var blob=new Blob([content],{type:mimeType});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=filename; a.style.display='none';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);document.body.removeChild(a);},1000);
}

      var dt=e.date?new Date(e.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'}):'';
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f3f4f6;font-size:12px">
        <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;margin-right:8px;color:#374151">${e.description}</div>
        <div style="flex-shrink:0;color:#6b7280">${dt}</div>
        <div style="flex-shrink:0;font-weight:700;color:#d97706;margin-left:8px">₹${Math.round(e.amount)}</div>
      </div>`;
    }).join('');

    h+=`<div class="dash-card ${isActive?'active-trip':''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px">
        <div style="min-width:0">
          <div style="font-weight:900;font-size:15px;color:#1f2937;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
            ${isActive?'📍 ':'📖 '}${t.name}
          </div>
          <div style="font-size:11px;color:#9ca3af;margin-top:2px">${dateStr?'📅 '+dateStr:''} · ${t.friends.length} people · ${t.expenses.length} expenses</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:18px;font-weight:900;color:#d97706">₹${Math.round(total).toLocaleString()}</div>
          <span class="dash-pill ${settled?'dash-settled':'dash-pending'}">${settled?'✓ Settled':'⏳ Pending'}</span>
        </div>
      </div>
      ${t.meta&&t.meta.budget>0?(()=>{
        var bg=parseFloat(t.meta.budget)||0;
        var over=total>bg;
        var pct=Math.min(100,Math.round(total/bg*100));
        return `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:4px">
            <span style="color:#6b7280">Budget ₹${Math.round(bg).toLocaleString()}</span>
            <span style="color:${over?'#ef4444':'#16a34a'}">${over?'⚠️ Over by ₹'+Math.round(total-bg).toLocaleString():'₹'+Math.round(bg-total).toLocaleString()+' left ('+pct+'%)'}</span>
          </div>
          <div style="background:#f3f4f6;border-radius:20px;height:7px;overflow:hidden">
            <div style="background:${over?'#ef4444':'#d97706'};height:100%;width:${pct}%;border-radius:20px"></div>
          </div>
        </div>`;
      })():''}
      ${myBalHtml?`<div style="margin-bottom:10px">${myBalHtml}</div>`:''}
      ${topExp.length?`
      <div style="border-top:2px solid #f3f4f6;padding-top:8px">
        <div style="font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;margin-bottom:4px">Top Expenses</div>
        ${topHtml}
        ${t.expenses.length>3?`<div style="font-size:11px;color:#9ca3af;margin-top:4px">+${t.expenses.length-3} more</div>`:''}
      </div>`:''}
      ${!settled&&pending>0?`<div style="margin-top:10px;background:#fef2f2;border-radius:8px;padding:8px 10px;font-size:12px;color:#b91c1c;font-weight:600">
        💳 ₹${Math.round(pending)} pending settlement
      </div>`:''}
      <div style="margin-top:12px;padding-top:10px;border-top:2px solid #f3f4f6;display:flex;gap:8px">
        <button class="btn secondary sm" style="flex:1;font-size:12px" onclick="openShareModal('${t.id}')">📤 Export &amp; Share</button>
        <button class="btn primary sm" style="flex:1;font-size:12px" onclick="doSelectTrip('${t.id}');render()">📖 Open Story</button>
      </div>
    </div>`;
  });

  return h;
}

    <div class="stat-box"><div class="num">${allUsers.length}</div><div class="lbl2">Users</div></div>

              <div style="font-size:11px;color:#6b7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${u.email}</div>
              <div style="font-size:10px;color:#9ca3af;margin-top:2px">Registered: ${u.createdAt?new Date(u.createdAt).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'-'}</div>
            </div>
            <div style="display:flex;gap:5px;flex-shrink:0">
              <button class="btn green sm" onclick="doApproveUser('${u.username}')" title="Manually verify this user">✅ Verify</button>
              <button class="btn danger sm" onclick="doRejectUser('${u.username}')">✗ Delete</button>

          </div>`).join('');
        h+=`</div>`;

              <div style="font-weight:900;font-size:14px">${u.displayName||'—'} ${isMe?'<span style="font-size:10px;color:#d97706">(you)</span>':''}</div>

              <div style="display:flex;gap:4px;margin-top:5px;flex-wrap:wrap">${roleB}</div>
            </div>
            ${!isMe?`<div class="user-actions">
              <button class="btn danger sm" onclick="doBanUser('${u.username}',true)">🚫 Ban</button>
              ${u.role!=='admin'?`<button class="btn sm" style="background:#f5f3ff;color:#6d28d9" onclick="doPromoteUser('${u.username}')">👑</button>`:''}
              <button class="btn danger sm" onclick="doDeleteUser('${u.username}')">🗑️</button>
            </div>`:'<div style="color:#9ca3af;font-size:11px">You</div>'}

    if(!allTrips.length) h+=`<div class="empty"><p>No stories. Click Refresh.</p></div>`;
    else h+=allTrips.map(t=>{
      var dateStr=t.date?new Date(t.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'—';

        ? cats.map(c=>`

      }
    </div>`;
  }
  return h;
}

// Convert URLs in plain text to clickable <a> links (safe, opens in new tab)
function linkify(text){
  var urlRegex=/(https?:\/\/[^\s<>"']+)/g;
  return text.replace(urlRegex,function(url){
    return '<a href="'+url+'" target="_blank" rel="noopener noreferrer" style="color:#2563eb;text-decoration:underline;word-break:break-all">'+url+'</a>';
  });
}

function renderMemoryCards(){
  if(!memoriesLoaded) return `<div class="empty"><p>⏳ Loading memories...</p></div>`;
  if(!memories.length) return `<div class="empty"><p>No memories yet.<br><span style="font-size:12px;color:#9ca3af">Be the first to pen a memory from this story!</span></p></div>`;
  var PREVIEW=300;
  return memories.map(m=>{
    var dt=m.createdAt?new Date(m.createdAt).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}):'';
    var edited=m.editedAt?` <span style="color:#9ca3af;font-size:10px">(edited)</span>`:'';
    var canEdit=m.authorEmail===currentUser.email||currentUser.role==='admin';
    var canDel =m.authorEmail===currentUser.email||currentUser.role==='admin';
    var safeText=m.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    var linkedText=linkify(safeText); // convert URLs to clickable links
    var isLong=m.text.length>PREVIEW;
    var previewRaw=isLong?safeText.slice(0,PREVIEW)+'…':safeText;
    var previewLinked=linkify(previewRaw);
    return `<div class="mem-card" id="mc-${m.id}">
      <div style="white-space:pre-wrap;font-size:14px;color:#1f2937;line-height:1.65" id="mtext-${m.id}">${previewLinked}</div>
      ${isLong?`<button onclick="
        var el=document.getElementById('mtext-${m.id}');
        var isShort=el.getAttribute('data-expanded')!=='1';
        el.innerHTML=isShort?${JSON.stringify(linkedText)}:${JSON.stringify(previewLinked)};
        el.setAttribute('data-expanded',isShort?'1':'0');
        this.textContent=isShort?'▲ Show less':'▼ Read more';
      " style="background:none;color:#d97706;font-size:12px;font-weight:700;margin-top:4px;padding:0">▼ Read more</button>`:''}
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px solid #f3f4f6;gap:8px;flex-wrap:wrap">
        <span style="font-size:11px;color:#6b7280">✍️ <strong>${m.author||'Unknown'}</strong>${edited} · 🕐 ${dt}</span>
        <div style="display:flex;gap:5px;flex-shrink:0">
          ${canEdit?`<button class="btn sm" style="background:#ede9fe;color:#6d28d9;font-size:11px" onclick="openEditMemory('${m.id}')">✏️ Edit</button>`:''}
          ${canDel?`<button class="dbtn" onclick="doDelMemory('${m.id}')" style="font-size:13px">🗑️</button>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

       'लॉगिन के बाद आप स्टोरी स्क्रीन पर पहुँचते हैं। स्टोरी बनाएँ या सूची से कोई खोलें।']
    ]},
    {t:'📖 स्टोरी', b:[
      '<strong>स्टोरी</strong> किसी यात्रा या साझा खर्चों के समूह को कहते हैं, जैसे "गोवा ट्रिप 2026"।',
      ['<strong>बनाएँ:</strong> स्टोरी का नाम, उद्देश्य और शुरुआती तारीख दर्ज करके <em>Start Story</em> दबाएँ। आप उसके मालिक बन जाते हैं।',
       '<strong>बदलें:</strong> ऊपर की पट्टी में 🔀 दबाकर स्टोरी सूची पर लौटें।',
       '<strong>एक्सेस दें:</strong> मालिक 🔑 दबाकर ईमेल या ग्रुप से दूसरे रजिस्टर्ड उपयोगकर्ताओं को एक्सेस दे सकते हैं।',
       '<strong>हटाएँ:</strong> मालिक Expenses टैब में 🗑️ बटन से स्टोरी हटा सकते हैं।']
    ]},
    {t:'👥 फ्रेंड्स टैब', b:[
      ['<strong>सदस्य:</strong> नाम से व्यक्ति जोड़ने के लिए <em>+ Add Friend</em> दबाएँ। ✕ से किसी को हटाएँ (जिसके खर्च हों उसे नहीं हटा सकते)। स्टोरी के मालिक को हटाया नहीं जा सकता।',
       '<strong>Share</strong> हर व्यक्ति का सारे खर्चों में कुल हिस्सा दिखाता है। <strong>Gets back / Owes</strong> भुगतान के बाद उनकी स्थिति बताता है।',
       '<strong>My Groups:</strong> ईमेल का ग्रुप बनाएँ (जैसे परिवार) और <em>Grant Story Access</em> दबाकर सबको एक साथ स्टोरी में जोड़ें।']
    ]},
    {t:'💸 खर्च जोड़ना', b:[
      '<strong>Expenses</strong> टैब खोलें और <strong>+ Add</strong> दबाएँ। भरें:',
      ['<strong>विवरण</strong>, <strong>मुद्रा</strong> और <strong>राशि</strong>।',
       '<strong>किसने भुगतान किया</strong>, वैकल्पिक <strong>श्रेणी</strong>, और <strong>तारीख / समय</strong>।',
       '<strong>बँटवारे का प्रकार:</strong> नीचे दिए चार बटनों में से एक चुनें।'],
      ['<strong>⚖️ Equal:</strong> सभी सदस्यों में बराबर बाँटें।',
       '<strong>👥 Exclude:</strong> बराबर बाँटें, पर जिन्हें भुगतान नहीं करना उनका निशान हटाएँ।',
       '<strong>🧮 Share:</strong> लोगों को अलग-अलग शेयर दें (जैसे जोड़े को 2, बच्चे को 1)। कुल शेयर सदस्यों की संख्या के बराबर होने चाहिए, नहीं तो Add बंद रहेगा।',
       '<strong>✏️ Custom:</strong> हर व्यक्ति की सटीक राशि दर्ज करें, या % चुनकर कुल 100 प्रतिशत के प्रतिशत भरें।'],
      'खर्च बदलने के लिए ✏️ और हटाने के लिए ✕ दबाएँ। जिन राशियों का योग कुल राशि के बराबर न हो, वे सेव नहीं होतीं।'
    ]},
    {t:'🌍 कई मुद्राएँ', b:[
      ['चुनी गई मुद्रा में खर्च जोड़ें। रेट बॉक्स आज की दर और परिवर्तित राशि दिखाता है।',
       'हर हिस्सा आपकी पसंदीदा मुद्रा में भी दिखता है।',
       '<strong>My Profile</strong> (ऊपर दाएँ अपने अक्षरों पर दबाएँ) में पसंदीदा मुद्रा सेट करें। सभी कुल, बैलेंस और भुगतान उसी में दिखते हैं।',
       'दरें हर दिन अपने-आप अपडेट होती हैं।']
    ]},
    {t:'📊 बजट (Expenses → Budget)', b:[
      ['श्रेणी के अनुसार खर्च और तय बजट दिखाता है।',
       'मालिक और एडमिन किसी श्रेणी पर ✏️ दबाकर बजट तय कर सकते हैं।',
       'श्रेणियाँ एडमिन (👑 Admin → Categories) द्वारा तय की जाती हैं।']
    ]},
    {t:'🤝 हिसाब चुकाएँ', b:[
      ['<strong>Current Balances</strong> भुगतान के बाद बताता है कि कौन किसे देगा या किससे लेना है।',
       '<strong>Payments to Make</strong> बताता है कौन किसे भुगतान करे। <em>Pay UPI</em> दबाने पर राशि भरे हुए UPI ऐप में खुलती है।',
       'भुगतान के बाद <em>Mark Paid</em> दबाएँ और राशि (पूरी या आंशिक) दर्ज करें। सूची अपने-आप अपडेट होती है।',
       '<strong>Payment History</strong> में सभी दर्ज भुगतान दिखते हैं। गलती हो तो ↩️ Undo से उसे पलटें।']
    ]},
    {t:'📝 यादें', b:[
      'स्टोरी की बातें या यादगार पल लिखें। जिनके पास एक्सेस है वे सब पढ़ सकते हैं। आप अपनी यादें संपादित या हटा सकते हैं।'
    ]},
    {t:'📤 सारांश और शेयरिंग', b:[
      ['<strong>Summary</strong> टैब सभी स्टोरी का कुल हिसाब और हर स्टोरी का कार्ड दिखाता है।',
       'किसी स्टोरी पर <em>Export &amp; Share</em> दबाएँ:'],
      ['<strong>CSV डाउनलोड करें:</strong> Excel या Google Sheets के लिए पूरी रिपोर्ट।',
       '<strong>Share as Text:</strong> WhatsApp, SMS या ईमेल के लिए छोटा संदेश।',
       '<strong>Share with Pay UPI Buttons:</strong> टैप करके भुगतान वाले बटन सहित वेब पेज।']
    ]},
    {t:'👤 मेरी प्रोफ़ाइल', b:[
      ['ऊपर दाएँ अपने अक्षरों पर दबाकर नाम और पसंदीदा मुद्रा बदलें।',
       'नाम बदलने पर वह उन सभी स्टोरी में भी अपडेट होता है जिनमें आप हैं।']
    ]},
    {t:'👑 एडमिन (केवल एडमिन के लिए)', b:[
      ['<strong>Users:</strong> नए साइन-अप सत्यापित करें, उपयोगकर्ताओं को बैन या अनबैन करें, किसी को एडमिन बनाएँ, या खाता हटाएँ।',
       '<strong>Stories:</strong> सभी स्टोरी देखें और कोई भी हटाएँ।',
       '<strong>Categories:</strong> सभी के लिए खर्च की श्रेणियाँ जोड़ें या हटाएँ।']
    ]},
    {t:'💡 जानना ज़रूरी है', b:[
      ['ऐप हर 10 सेकंड में अपने-आप अपडेट होता है।',
       'स्टोरी बदलने के लिए 🔀 और लॉग आउट के लिए ⏏️ दबाएँ।']
    ]}
  ]
},
es: {
  title:'Guía de usuario',
  intro:'Toca una sección para abrirla. Usa el icono ❓ de arriba en cualquier momento para volver aquí.',
  close:'Entendido',
  sections:[
    {t:'🚀 Primeros pasos', open:true, b:[
      'Regístrate con tu nombre, correo y una contraseña (6 o más caracteres). Se envía un código OTP a tu correo; introdúcelo para activar tu cuenta.',
      ['La primera cuenta registrada se convierte en <strong>Admin</strong>.',
       '¿Olvidaste tu contraseña? Usa <strong>Forgot password</strong> en la pantalla de inicio y escribe el OTP enviado a tu correo.',
       'Tras iniciar sesión verás la pantalla de Historias. Crea una historia o abre una de la lista.']
    ]},
    {t:'📖 Historias', b:[
      'Una <strong>historia</strong> es un viaje o grupo de gastos compartidos, por ejemplo "Viaje a Goa 2026".',
      ['<strong>Crear:</strong> escribe el nombre, el propósito y la fecha de inicio, y pulsa <em>Start Story</em>. Tú eres su propietario.',
       '<strong>Cambiar:</strong> pulsa 🔀 en la barra superior para volver a la lista.',
       '<strong>Compartir acceso:</strong> los propietarios pulsan 🔑 para dar acceso a otros usuarios registrados, por correo o por grupo.',
       '<strong>Eliminar:</strong> los propietarios pueden borrar una historia con el botón 🗑️ de la pestaña Gastos.']
    ]},
    {t:'👥 Pestaña Amigos', b:[
      ['<strong>Miembros:</strong> pulsa <em>+ Add Friend</em> para añadir a alguien por nombre. Usa ✕ para quitar a alguien (no es posible si tiene gastos). El propietario no se puede quitar.',
       '<strong>Share</strong> muestra la parte total de cada persona en todos los gastos. <strong>Gets back / Owes</strong> muestra su situación tras los pagos.',
       '<strong>Mis grupos:</strong> crea un grupo de correos (por ejemplo tu familia) y pulsa <em>Grant Story Access</em> para añadirlos a la historia de una vez.']
    ]},
    {t:'💸 Añadir un gasto', b:[
      'Abre la pestaña <strong>Gastos</strong> y pulsa <strong>+ Add</strong>. Completa:',
      ['<strong>Descripción</strong>, <strong>Moneda</strong> e <strong>Importe</strong>.',
       '<strong>Quién pagó</strong>, <strong>Categoría</strong> (opcional) y <strong>Fecha / Hora</strong>.',
       '<strong>Tipo de reparto:</strong> elige uno de los cuatro botones.'],
      ['<strong>⚖️ Equal:</strong> reparte a partes iguales entre todos.',
       '<strong>👥 Exclude:</strong> reparte a partes iguales, pero desmarca a quienes no deben pagar.',
       '<strong>🧮 Share:</strong> asigna un número distinto de partes a cada persona (por ejemplo 2 a una pareja y 1 a un niño). El total de partes debe igualar el número de miembros, o Add quedará desactivado.',
       '<strong>✏️ Custom:</strong> introduce importes exactos por persona, o cambia a % e introduce porcentajes que sumen 100.'],
      'Usa ✏️ para editar un gasto y ✕ para borrarlo. Los importes que no suman el total no se guardan.'
    ]},
    {t:'🌍 Varias monedas', b:[
      ['Elige cualquier moneda al añadir un gasto. El recuadro de tipo de cambio muestra el tipo de hoy y el total convertido.',
       'Cada parte también se muestra en tu moneda preferida.',
       'Define tu moneda preferida en <strong>Mi perfil</strong> (pulsa tus iniciales, arriba a la derecha). Todos los totales, saldos y pagos se muestran en ella.',
       'Los tipos de cambio se actualizan automáticamente cada día.']
    ]},
    {t:'📊 Presupuesto (Gastos → Presupuesto)', b:[
      ['Muestra el gasto por categoría frente al presupuesto previsto.',
       'Propietarios y administradores pulsan ✏️ en una categoría para fijar su presupuesto.',
       'Las categorías las gestiona el administrador (👑 Admin → Categories).']
    ]},
    {t:'🤝 Liquidar cuentas', b:[
      ['<strong>Current Balances</strong> muestra quién debe o a quién le deben dinero tras los pagos.',
       '<strong>Payments to Make</strong> indica quién debe pagar a quién. Pulsa <em>Pay UPI</em> para abrir tu app UPI con el importe ya rellenado.',
       'Tras pagar, pulsa <em>Mark Paid</em> e introduce el importe (total o parcial). La lista se actualiza sola.',
       '<strong>Payment History</strong> recoge todos los pagos registrados. Usa ↩️ Undo para revertir un error.']
    ]},
    {t:'📝 Recuerdos', b:[
      'Escribe notas o momentos favoritos de la historia. Todos los que tengan acceso pueden leerlos. Puedes editar o borrar tus propios recuerdos.'
    ]},
    {t:'📤 Resumen y compartir', b:[
      ['La pestaña <strong>Summary</strong> muestra tus totales de todas las historias y una tarjeta por historia.',
       'Pulsa <em>Export &amp; Share</em> en una historia para:'],
      ['<strong>Descargar CSV:</strong> informe completo para Excel o Google Sheets.',
       '<strong>Share as Text:</strong> mensaje breve de liquidación para WhatsApp, SMS o correo.',
       '<strong>Share with Pay UPI Buttons:</strong> página web con botones de pago UPI.']
    ]},
    {t:'👤 Mi perfil', b:[
      ['Pulsa tus iniciales (arriba a la derecha) para cambiar tu nombre y tu moneda preferida.',
       'Si cambias tu nombre, también se actualiza en las historias en las que participas.']
    ]},
    {t:'👑 Admin (solo administradores)', b:[
      ['<strong>Users:</strong> verifica nuevos registros, bloquea o desbloquea usuarios, nombra administradores o elimina cuentas.',
       '<strong>Stories:</strong> consulta todas las historias y elimina cualquiera.',
       '<strong>Categories:</strong> añade o quita las categorías de gasto disponibles para todos.']
    ]},
    {t:'💡 Bueno saber', b:[
      ['La app se actualiza automáticamente cada 10 segundos.',
       'Cambia de historia con 🔀 y cierra sesión con ⏏️.']
    ]}
  ]
},
fr: {
  title:'Guide de l’utilisateur',
  intro:'Appuyez sur une section pour l’ouvrir. Utilisez l’icône ❓ en haut à tout moment pour revenir ici.',
  close:'Compris',
  sections:[
    {t:'🚀 Pour commencer', open:true, b:[
      'Inscrivez-vous avec votre nom, votre e-mail et un mot de passe (6 caractères minimum). Un code OTP vous est envoyé par e-mail ; saisissez-le pour activer votre compte.',
      ['Le premier compte inscrit devient <strong>Admin</strong>.',
       'Mot de passe oublié ? Utilisez <strong>Forgot password</strong> sur l’écran de connexion et saisissez le code OTP reçu par e-mail.',
       'Après la connexion, vous arrivez sur l’écran des Histoires. Créez une histoire ou ouvrez-en une dans la liste.']
    ]},
    {t:'📖 Histoires', b:[
      'Une <strong>histoire</strong> est un voyage ou un groupe de dépenses partagées, par exemple « Voyage à Goa 2026 ».',
      ['<strong>Créer :</strong> saisissez le nom, l’objectif et la date de début, puis appuyez sur <em>Start Story</em>. Vous en devenez le propriétaire.',
       '<strong>Changer :</strong> appuyez sur 🔀 dans la barre supérieure pour revenir à la liste.',
       '<strong>Partager l’accès :</strong> les propriétaires appuient sur 🔑 pour donner accès à d’autres utilisateurs inscrits, par e-mail ou par groupe.',
       '<strong>Supprimer :</strong> les propriétaires peuvent supprimer une histoire avec le bouton 🗑️ de l’onglet Dépenses.']
    ]},
    {t:'👥 Onglet Amis', b:[
      ['<strong>Membres :</strong> appuyez sur <em>+ Add Friend</em> pour ajouter une personne par son nom. Utilisez ✕ pour retirer quelqu’un (impossible s’il a des dépenses). Le propriétaire ne peut pas être retiré.',
       '<strong>Share</strong> affiche la part totale de chacun dans toutes les dépenses. <strong>Gets back / Owes</strong> indique sa situation après les paiements.',
       '<strong>Mes groupes :</strong> créez un groupe d’e-mails (par exemple votre famille) et appuyez sur <em>Grant Story Access</em> pour les ajouter tous à l’histoire d’un coup.']
    ]},
    {t:'💸 Ajouter une dépense', b:[
      'Ouvrez l’onglet <strong>Dépenses</strong> et appuyez sur <strong>+ Add</strong>. Renseignez :',
      ['<strong>Description</strong>, <strong>Devise</strong> et <strong>Montant</strong>.',
       '<strong>Qui a payé</strong>, <strong>Catégorie</strong> (facultatif) et <strong>Date / Heure</strong>.',
       '<strong>Type de répartition :</strong> choisissez l’un des quatre boutons.'],
      ['<strong>⚖️ Equal :</strong> répartition égale entre tous.',
       '<strong>👥 Exclude :</strong> répartition égale, mais décochez ceux qui ne doivent pas payer.',
       '<strong>🧮 Share :</strong> attribuez un nombre de parts différent à chacun (par exemple 2 pour un couple, 1 pour un enfant). Le total des parts doit être égal au nombre de membres, sinon Add reste désactivé.',
       '<strong>✏️ Custom :</strong> saisissez des montants exacts par personne, ou passez en % et saisissez des pourcentages totalisant 100.'],
      'Utilisez ✏️ pour modifier une dépense et ✕ pour la supprimer. Les montants qui ne correspondent pas au total ne sont pas enregistrés.'
    ]},
    {t:'🌍 Plusieurs devises', b:[
      ['Choisissez n’importe quelle devise lors de l’ajout d’une dépense. L’encadré de taux affiche le taux du jour et le montant converti.',
       'Chaque part est aussi affichée dans votre devise préférée.',
       'Définissez votre devise préférée dans <strong>Mon profil</strong> (appuyez sur vos initiales, en haut à droite). Tous les totaux, soldes et règlements y sont affichés.',
       'Les taux se mettent à jour automatiquement chaque jour.']
    ]},
    {t:'📊 Budget (Dépenses → Budget)', b:[
      ['Affiche les dépenses par catégorie par rapport au budget prévu.',
       'Les propriétaires et administrateurs appuient sur ✏️ à côté d’une catégorie pour définir son budget.',
       'Les catégories sont gérées par l’administrateur (👑 Admin → Categories).']
    ]},
    {t:'🤝 Régler les comptes', b:[
      ['<strong>Current Balances</strong> indique qui doit ou qui doit recevoir de l’argent après les paiements.',
       '<strong>Payments to Make</strong> indique qui doit payer qui. Appuyez sur <em>Pay UPI</em> pour ouvrir votre appli UPI avec le montant déjà saisi.',
       'Après un paiement, appuyez sur <em>Mark Paid</em> et saisissez le montant (total ou partiel). La liste se met à jour automatiquement.',
       '<strong>Payment History</strong> liste tous les paiements enregistrés. Utilisez ↩️ Undo pour annuler une erreur.']
    ]},
    {t:'📝 Souvenirs', b:[
      'Écrivez des notes ou des moments forts de l’histoire. Toutes les personnes ayant accès peuvent les lire. Vous pouvez modifier ou supprimer vos propres souvenirs.'
    ]},
    {t:'📤 Résumé et partage', b:[
      ['L’onglet <strong>Summary</strong> affiche vos totaux pour toutes les histoires et une carte par histoire.',
       'Appuyez sur <em>Export &amp; Share</em> sur une histoire pour :'],
      ['<strong>Télécharger le CSV :</strong> rapport complet pour Excel ou Google Sheets.',
       '<strong>Share as Text :</strong> message de règlement court pour WhatsApp, SMS ou e-mail.',
       '<strong>Share with Pay UPI Buttons :</strong> page web avec des boutons de paiement UPI.']
    ]},
    {t:'👤 Mon profil', b:[
      ['Appuyez sur vos initiales (en haut à droite) pour modifier votre nom et votre devise préférée.',
       'Si vous changez votre nom, il est aussi mis à jour dans les histoires auxquelles vous participez.']
    ]},
    {t:'👑 Admin (administrateurs uniquement)', b:[
      ['<strong>Users :</strong> validez les nouvelles inscriptions, bloquez ou débloquez des utilisateurs, nommez un administrateur ou supprimez un compte.',
       '<strong>Stories :</strong> consultez toutes les histoires et supprimez-en.',
       '<strong>Categories :</strong> ajoutez ou supprimez les catégories de dépenses disponibles pour tous.']
    ]},
    {t:'💡 Bon à savoir', b:[
      ['L’application se met à jour automatiquement toutes les 10 secondes.',
       'Changez d’histoire avec 🔀 et déconnectez-vous avec ⏏️.']
    ]}
  ]
},kn: {
  title:'ಬಳಕೆದಾರ ಮಾರ್ಗದರ್ಶಿ',
  intro:'ಯಾವುದೇ ವಿಭಾಗವನ್ನು ತೆರೆಯಲು ಅದರ ಮೇಲೆ ಟ್ಯಾಪ್ ಮಾಡಿ. ಮೇಲಿನ ❓ ಐಕಾನ್ ಬಳಸಿ ಯಾವಾಗ ಬೇಕಾದರೂ ಇಲ್ಲಿಗೆ ಹಿಂತಿರುಗಿ.',
  close:'ಅರ್ಥವಾಯಿತು',
  sections:[
    {t:'🚀 ಪ್ರಾರಂಭಿಸುವುದು', open:true, b:[
      'ನಿಮ್ಮ ಹೆಸರು, ಇಮೇಲ್ ಮತ್ತು ಪಾಸ್‌ವರ್ಡ್ (6+ ಅಕ್ಷರಗಳು) ನೀಡಿ ನೋಂದಣಿ ಮಾಡಿ. ನಿಮ್ಮ ಇಮೇಲ್‌ಗೆ OTP ಕಳುಹಿಸಲಾಗುತ್ತದೆ; ಖಾತೆ ಸಕ್ರಿಯಗೊಳಿಸಲು ಅದನ್ನು ನಮೂದಿಸಿ.',
      ['ಮೊದಲು ನೋಂದಣಿಯಾದ ಖಾತೆ <strong>ಅಡ್ಮಿನ್</strong> ಆಗುತ್ತದೆ.',
       'ಪಾಸ್‌ವರ್ಡ್ ಮರೆತಿದ್ದೀರಾ? ಲಾಗಿನ್ ಪರದೆಯಲ್ಲಿ <strong>Forgot password</strong> ಬಳಸಿ ಮತ್ತು ಇಮೇಲ್‌ಗೆ ಬಂದ OTP ನಮೂದಿಸಿ.',
       'ಲಾಗಿನ್ ಆದ ನಂತರ ಸ್ಟೋರಿ ಪರದೆ ಕಾಣಿಸುತ್ತದೆ. ಹೊಸ ಸ್ಟೋರಿ ರಚಿಸಿ ಅಥವಾ ಪಟ್ಟಿಯಿಂದ ಒಂದನ್ನು ತೆರೆಯಿರಿ.']
    ]},
    {t:'📖 ಸ್ಟೋರಿಗಳು', b:[
      '<strong>ಸ್ಟೋರಿ</strong> ಎಂದರೆ ಹಂಚಿಕೊಂಡ ಖರ್ಚುಗಳ ಪ್ರವಾಸ ಅಥವಾ ಗುಂಪು, ಉದಾಹರಣೆಗೆ "ಗೋವಾ ಟ್ರಿಪ್ 2026".',
      ['<strong>ರಚಿಸಿ:</strong> ಸ್ಟೋರಿ ಹೆಸರು, ಉದ್ದೇಶ ಮತ್ತು ಆರಂಭ ದಿನಾಂಕ ನಮೂದಿಸಿ, ನಂತರ <em>Start Story</em> ಒತ್ತಿ. ನೀವು ಅದರ ಮಾಲೀಕರಾಗುತ್ತೀರಿ.',
       '<strong>ಬದಲಿಸಿ:</strong> ಮೇಲಿನ ಪಟ್ಟಿಯಲ್ಲಿ 🔀 ಒತ್ತಿ ಸ್ಟೋರಿ ಪಟ್ಟಿಗೆ ಹಿಂತಿರುಗಿ.',
       '<strong>ಪ್ರವೇಶ ಹಂಚಿಕೆ:</strong> ಮಾಲೀಕರು 🔑 ಒತ್ತಿ ಇಮೇಲ್ ಅಥವಾ ಗುಂಪಿನ ಮೂಲಕ ಇತರ ನೋಂದಾಯಿತ ಬಳಕೆದಾರರಿಗೆ ಪ್ರವೇಶ ನೀಡಬಹುದು.',
       '<strong>ಅಳಿಸಿ:</strong> ಮಾಲೀಕರು Expenses ಟ್ಯಾಬ್‌ನಲ್ಲಿರುವ 🗑️ ಬಟನ್ ಮೂಲಕ ಸ್ಟೋರಿಯನ್ನು ಅಳಿಸಬಹುದು.']
    ]},
    {t:'👥 ಫ್ರೆಂಡ್ಸ್ ಟ್ಯಾಬ್', b:[
      ['<strong>ಸದಸ್ಯರು:</strong> ಹೆಸರಿನಿಂದ ವ್ಯಕ್ತಿಯನ್ನು ಸೇರಿಸಲು <em>+ Add Friend</em> ಒತ್ತಿ. ✕ ಮೂಲಕ ತೆಗೆಯಿರಿ (ಖರ್ಚುಗಳಿದ್ದರೆ ಸಾಧ್ಯವಿಲ್ಲ). ಸ್ಟೋರಿ ಮಾಲೀಕರನ್ನು ತೆಗೆಯಲಾಗದು.',
       '<strong>Share</strong> ಪ್ರತಿಯೊಬ್ಬರ ಒಟ್ಟು ಪಾಲನ್ನು ತೋರಿಸುತ್ತದೆ. <strong>Gets back / Owes</strong> ಪಾವತಿಯ ನಂತರದ ಸ್ಥಿತಿಯನ್ನು ತೋರಿಸುತ್ತದೆ.',
       '<strong>ನನ್ನ ಗುಂಪುಗಳು:</strong> ಇಮೇಲ್‌ಗಳ ಗುಂಪು ರಚಿಸಿ (ಉದಾ: ಕುಟುಂಬ) ಮತ್ತು <em>Grant Story Access</em> ಒತ್ತಿ ಎಲ್ಲರನ್ನೂ ಒಮ್ಮೆಗೇ ಸ್ಟೋರಿಗೆ ಸೇರಿಸಿ.']
    ]},
    {t:'💸 ಖರ್ಚು ಸೇರಿಸುವುದು', b:[
      'ಖರ್ಚುಗಳ ಟ್ಯಾಬ್ ತೆರೆದು <strong>+ Add</strong> ಒತ್ತಿ. ಭರ್ತಿ ಮಾಡಿ:',
      ['<strong>ವಿವರಣೆ</strong>, <strong>ಕರೆನ್ಸಿ</strong> ಮತ್ತು <strong>ಮೊತ್ತ</strong>.',
       '<strong>ಯಾರು ಪಾವತಿಸಿದರು</strong>, ಐಚ್ಛಿಕ <strong>ವರ್ಗ</strong>, ಮತ್ತು <strong>ದಿನಾಂಕ / ಸಮಯ</strong>.',
       '<strong>ಹಂಚಿಕೆ ಪ್ರಕಾರ:</strong> ಕೆಳಗಿನ ನಾಲ್ಕು ಬಟನ್‌ಗಳಲ್ಲಿ ಒಂದನ್ನು ಆರಿಸಿ.'],
      ['<strong>⚖️ Equal:</strong> ಎಲ್ಲ ಸದಸ್ಯರ ನಡುವೆ ಸಮಾನವಾಗಿ ಹಂಚಿ.',
       '<strong>👥 Exclude:</strong> ಸಮಾನವಾಗಿ ಹಂಚಿ, ಆದರೆ ಪಾವತಿಸಬಾರದವರ ಟಿಕ್ ತೆಗೆಯಿರಿ.',
       '<strong>🧮 Share:</strong> ಪ್ರತಿಯೊಬ್ಬರಿಗೂ ವಿಭಿನ್ನ ಸಂಖ್ಯೆಯ ಪಾಲು ನೀಡಿ (ಉದಾ: ದಂಪತಿಗೆ 2, ಮಗುವಿಗೆ 1). ಒಟ್ಟು ಪಾಲುಗಳು ಸದಸ್ಯರ ಸಂಖ್ಯೆಗೆ ಸಮವಾಗಿರಬೇಕು, ಇಲ್ಲದಿದ್ದರೆ Add ನಿಷ್ಕ್ರಿಯವಾಗಿರುತ್ತದೆ.',
       '<strong>✏️ Custom:</strong> ಪ್ರತಿಯೊಬ್ಬರಿಗೂ ನಿಖರ ಮೊತ್ತ ನಮೂದಿಸಿ, ಅಥವಾ % ಆರಿಸಿ 100 ಆಗುವಂತೆ ಶೇಕಡಾವಾರು ನಮೂದಿಸಿ.'],
      'ಖರ್ಚು ತಿದ್ದಲು ✏️ ಮತ್ತು ಅಳಿಸಲು ✕ ಒತ್ತಿ. ಒಟ್ಟು ಮೊತ್ತಕ್ಕೆ ಸರಿಹೊಂದದ ಮೊತ್ತಗಳನ್ನು ಉಳಿಸಲಾಗುವುದಿಲ್ಲ.'
    ]},
    {t:'🌍 ಹಲವು ಕರೆನ್ಸಿಗಳು', b:[
      ['ಖರ್ಚು ಸೇರಿಸುವಾಗ ಯಾವುದೇ ಕರೆನ್ಸಿ ಆರಿಸಿ. ದರ ಪೆಟ್ಟಿಗೆ ಇಂದಿನ ದರ ಮತ್ತು ಪರಿವರ್ತಿತ ಮೊತ್ತವನ್ನು ತೋರಿಸುತ್ತದೆ.',
       'ಪ್ರತಿ ಪಾಲು ನಿಮ್ಮ ಆದ್ಯತೆಯ ಕರೆನ್ಸಿಯಲ್ಲಿಯೂ ತೋರಿಸಲಾಗುತ್ತದೆ.',
       '<strong>My Profile</strong> (ಮೇಲ್ಭಾಗದಲ್ಲಿ ನಿಮ್ಮ ಅಕ್ಷರಗಳ ಮೇಲೆ ಒತ್ತಿ) ನಲ್ಲಿ ಆದ್ಯತೆಯ ಕರೆನ್ಸಿ ಹೊಂದಿಸಿ. ಎಲ್ಲ ಒಟ್ಟು, ಬಾಕಿ ಮತ್ತು ಪಾವತಿಗಳು ಅದರಲ್ಲೇ ತೋರಿಸಲಾಗುತ್ತವೆ.',
       'ದರಗಳು ಪ್ರತಿದಿನ ಸ್ವಯಂಚಾಲಿತವಾಗಿ ನವೀಕರಣಗೊಳ್ಳುತ್ತವೆ.']
    ]},
    {t:'📊 ಬಜೆಟ್ (Expenses → Budget)', b:[
      ['ಯೋಜಿತ ಬಜೆಟ್‌ಗೆ ಹೋಲಿಸಿ ವರ್ಗವಾರು ಖರ್ಚು ತೋರಿಸುತ್ತದೆ.',
       'ಮಾಲೀಕರು ಮತ್ತು ಅಡ್ಮಿನ್‌ಗಳು ವರ್ಗದ ಮೇಲಿನ ✏️ ಒತ್ತಿ ಬಜೆಟ್ ನಿಗದಿಪಡಿಸಬಹುದು.',
       'ವರ್ಗಗಳನ್ನು ಅಡ್ಮಿನ್ ನಿರ್ವಹಿಸುತ್ತಾರೆ (👑 Admin → Categories).']
    ]},
    {t:'🤝 ಲೆಕ್ಕ ಚುಕ್ತಾ ಮಾಡಿ', b:[
      ['<strong>Current Balances</strong> ಪಾವತಿಯ ನಂತರ ಯಾರಿಗೆ ಹಣ ಬರಬೇಕು ಅಥವಾ ಯಾರು ಕೊಡಬೇಕು ಎಂದು ತೋರಿಸುತ್ತದೆ.',
       '<strong>Payments to Make</strong> ಯಾರು ಯಾರಿಗೆ ಪಾವತಿಸಬೇಕು ಎಂದು ತೋರಿಸುತ್ತದೆ. <em>Pay UPI</em> ಒತ್ತಿದರೆ ಮೊತ್ತ ತುಂಬಿದ UPI ಆ್ಯಪ್ ತೆರೆಯುತ್ತದೆ.',
       'ಪಾವತಿಸಿದ ನಂತರ <em>Mark Paid</em> ಒತ್ತಿ ಮೊತ್ತ (ಪೂರ್ಣ ಅಥವಾ ಭಾಗಶಃ) ನಮೂದಿಸಿ. ಪಟ್ಟಿ ಸ್ವಯಂಚಾಲಿತವಾಗಿ ನವೀಕರಣಗೊಳ್ಳುತ್ತದೆ.',
       '<strong>Payment History</strong> ದಾಖಲಾದ ಎಲ್ಲ ಪಾವತಿಗಳನ್ನು ತೋರಿಸುತ್ತದೆ. ತಪ್ಪಾಗಿದ್ದರೆ ↩️ Undo ಬಳಸಿ.']
    ]},
    {t:'📝 ನೆನಪುಗಳು', b:[
      'ಸ್ಟೋರಿಯ ಟಿಪ್ಪಣಿಗಳು ಅಥವಾ ನೆಚ್ಚಿನ ಕ್ಷಣಗಳನ್ನು ಬರೆಯಿರಿ. ಪ್ರವೇಶ ಇರುವ ಎಲ್ಲರೂ ಓದಬಹುದು. ನಿಮ್ಮ ಸ್ವಂತ ನೆನಪುಗಳನ್ನು ತಿದ್ದಬಹುದು ಅಥವಾ ಅಳಿಸಬಹುದು.'
    ]},
    {t:'📤 ಸಾರಾಂಶ ಮತ್ತು ಹಂಚಿಕೆ', b:[
      ['<strong>Summary</strong> ಟ್ಯಾಬ್ ಎಲ್ಲ ಸ್ಟೋರಿಗಳ ಒಟ್ಟು ಲೆಕ್ಕ ಮತ್ತು ಪ್ರತಿ ಸ್ಟೋರಿಯ ಕಾರ್ಡ್ ತೋರಿಸುತ್ತದೆ.',
       'ಸ್ಟೋರಿಯಲ್ಲಿ <em>Export &amp; Share</em> ಒತ್ತಿ:'],
      ['<strong>CSV ಡೌನ್‌ಲೋಡ್:</strong> Excel ಅಥವಾ Google Sheets ಗಾಗಿ ಸಂಪೂರ್ಣ ವರದಿ.',
       '<strong>Share as Text:</strong> WhatsApp, SMS ಅಥವಾ ಇಮೇಲ್‌ಗೆ ಸಂಕ್ಷಿಪ್ತ ಸಂದೇಶ.',
       '<strong>Share with Pay UPI Buttons:</strong> ಟ್ಯಾಪ್ ಮಾಡಿ ಪಾವತಿಸುವ ಬಟನ್‌ಗಳಿರುವ ವೆಬ್ ಪುಟ.']
    ]},
    {t:'👤 ನನ್ನ ಪ್ರೊಫೈಲ್', b:[
      ['ಮೇಲ್ಭಾಗದಲ್ಲಿ ನಿಮ್ಮ ಅಕ್ಷರಗಳ ಮೇಲೆ ಒತ್ತಿ ಹೆಸರು ಮತ್ತು ಆದ್ಯತೆಯ ಕರೆನ್ಸಿ ಬದಲಿಸಿ.',
       'ಹೆಸರು ಬದಲಿಸಿದರೆ ನೀವು ಇರುವ ಸ್ಟೋರಿಗಳಲ್ಲಿಯೂ ಅದು ನವೀಕರಣಗೊಳ್ಳುತ್ತದೆ.']
    ]},
    {t:'👑 ಅಡ್ಮಿನ್ (ಅಡ್ಮಿನ್‌ಗಳಿಗೆ ಮಾತ್ರ)', b:[
      ['<strong>Users:</strong> ಹೊಸ ಸೈನ್-ಅಪ್‌ಗಳನ್ನು ಪರಿಶೀಲಿಸಿ, ಬಳಕೆದಾರರನ್ನು ನಿರ್ಬಂಧಿಸಿ ಅಥವಾ ಅನಿರ್ಬಂಧಿಸಿ, ಯಾರನ್ನಾದರೂ ಅಡ್ಮಿನ್ ಮಾಡಿ, ಅಥವಾ ಖಾತೆ ಅಳಿಸಿ.',
       '<strong>Stories:</strong> ಎಲ್ಲ ಸ್ಟೋರಿಗಳನ್ನು ನೋಡಿ ಯಾವುದನ್ನಾದರೂ ಅಳಿಸಿ.',
       '<strong>Categories:</strong> ಎಲ್ಲರಿಗೂ ಲಭ್ಯವಿರುವ ಖರ್ಚು ವರ್ಗಗಳನ್ನು ಸೇರಿಸಿ ಅಥವಾ ತೆಗೆಯಿರಿ.']
    ]},
    {t:'💡 ತಿಳಿದಿರಲಿ', b:[
      ['ಆ್ಯಪ್ ಪ್ರತಿ 10 ಸೆಕೆಂಡ್‌ಗೆ ಸ್ವಯಂಚಾಲಿತವಾಗಿ ನವೀಕರಣಗೊಳ್ಳುತ್ತದೆ.',
       'ಸ್ಟೋರಿ ಬದಲಿಸಲು 🔀 ಮತ್ತು ಲಾಗ್ ಔಟ್ ಆಗಲು ⏏️ ಒತ್ತಿ.']
    ]}
  ]
},
ta: {
  title:"பயனர் வழிகாட்டி",
  intro:"எந்தப் பிரிவையும் திறக்க அதைத் தட்டவும். மேலே உள்ள ❓ ஐகானைப் பயன்படுத்தி எப்போது வேண்டுமானாலும் இங்கு திரும்பலாம்.",
  close:"புரிந்தது",
  sections:[
    {t:"🚀 தொடங்குதல்", open:true, b:["உங்கள் பெயர், மின்னஞ்சல் மற்றும் கடவுச்சொல்லுடன் (6+ எழுத்துகள்) பதிவு செய்யுங்கள். உங்கள் மின்னஞ்சலுக்கு OTP அனுப்பப்படும்; கணக்கைச் செயல்படுத்த அதை உள்ளிடுங்கள்.",
      ["முதலில் பதிவு செய்த கணக்கு <strong>Admin</strong> ஆகும்.", "கடவுச்சொல் மறந்துவிட்டதா? உள்நுழைவுத் திரையில் <strong>Forgot password</strong> பயன்படுத்தி மின்னஞ்சலுக்கு வந்த OTP ஐ உள்ளிடுங்கள்.", "உள்நுழைந்த பிறகு ஸ்டோரி திரை தோன்றும். புதிய ஸ்டோரியை உருவாக்குங்கள் அல்லது பட்டியலில் இருந்து ஒன்றைத் திறக்கவும்."]]},
    {t:"📖 ஸ்டோரிகள்", open:false, b:["<strong>ஸ்டோரி</strong> என்பது பகிரப்பட்ட செலவுகளைக் கொண்ட பயணம் அல்லது குழு, எ.கா. \"கோவா பயணம் 2026\".",
      ["<strong>உருவாக்க:</strong> ஸ்டோரி பெயர், நோக்கம் மற்றும் தொடக்கத் தேதியை உள்ளிட்டு <em>Start Story</em> தட்டுங்கள். நீங்கள் அதன் உரிமையாளர் ஆவீர்கள்.", "<strong>மாற்ற:</strong> மேல் பட்டையில் 🔀 தட்டி ஸ்டோரி பட்டியலுக்குத் திரும்புங்கள்.", "<strong>அணுகல் பகிர:</strong> உரிமையாளர்கள் 🔑 தட்டி மின்னஞ்சல் அல்லது குழு மூலம் பிற பதிவு பெற்ற பயனர்களுக்கு அணுகல் வழங்கலாம்.", "<strong>நீக்க:</strong> உரிமையாளர்கள் Expenses தாவலில் உள்ள 🗑️ பொத்தானால் ஸ்டோரியை நீக்கலாம்."]]},
    {t:"👥 Friends தாவல்", open:false, b:[["<strong>உறுப்பினர்கள்:</strong> பெயரால் ஒருவரைச் சேர்க்க <em>+ Add Friend</em> தட்டுங்கள். ✕ மூலம் நீக்கலாம் (செலவுகள் இருந்தால் முடியாது). ஸ்டோரி உரிமையாளரை நீக்க முடியாது.", "<strong>Share</strong> ஒவ்வொருவரின் மொத்தப் பங்கைக் காட்டும். <strong>Gets back / Owes</strong> பணம் செலுத்திய பிறகு அவர்களின் நிலையைக் காட்டும்.", "<strong>என் குழுக்கள்:</strong> மின்னஞ்சல்களின் குழு உருவாக்கி (எ.கா. குடும்பம்) <em>Grant Story Access</em> தட்டி அனைவருக்கும் ஒரே முறையில் அணுகல் வழங்குங்கள்."]]},
    {t:"💸 செலவு சேர்த்தல்", open:false, b:["Expenses தாவலைத் திறந்து <strong>+ Add</strong> தட்டுங்கள். நிரப்புங்கள்:",
      ["<strong>விவரம்</strong>, <strong>நாணயம்</strong> மற்றும் <strong>தொகை</strong>.", "<strong>யார் செலுத்தியது</strong>, விருப்ப <strong>வகை</strong>, மற்றும் <strong>தேதி / நேரம்</strong>.", "<strong>பகிர்வு வகை:</strong> கீழே உள்ள நான்கு பொத்தான்களில் ஒன்றைத் தேர்ந்தெடுங்கள்."],
      ["<strong>⚖️ Equal:</strong> அனைத்து உறுப்பினர்களுக்கும் சமமாகப் பிரிக்கவும்.", "<strong>👥 Exclude:</strong> சமமாகப் பிரிக்கவும், ஆனால் பணம் செலுத்தக் கூடாதவர்களின் டிக்கை நீக்கவும்.", "<strong>🧮 Share:</strong> ஒவ்வொருவருக்கும் வெவ்வேறு எண்ணிக்கையில் பங்குகள் கொடுங்கள் (எ.கா. ஒரு ஜோடிக்கு 2, குழந்தைக்கு 1). மொத்தப் பங்குகள் உறுப்பினர் எண்ணிக்கைக்குச் சமமாக இருக்க வேண்டும், இல்லையெனில் Add முடக்கப்படும்.", "<strong>✏️ Custom:</strong> ஒவ்வொருவருக்கும் சரியான தொகையை உள்ளிடுங்கள், அல்லது % தேர்ந்து மொத்தம் 100 ஆகும் சதவீதங்களை உள்ளிடுங்கள்."],
      "செலவைத் திருத்த ✏️ மற்றும் நீக்க ✕ தட்டுங்கள். மொத்தத்துடன் பொருந்தாத தொகைகள் சேமிக்கப்படாது."]},
    {t:"🌍 பல நாணயங்கள்", open:false, b:[["செலவு சேர்க்கும்போது எந்த நாணயத்தையும் தேர்ந்தெடுக்கலாம். விகிதப் பெட்டி இன்றைய விகிதத்தையும் மாற்றப்பட்ட தொகையையும் காட்டும்.", "ஒவ்வொரு பங்கும் உங்கள் விருப்ப நாணயத்திலும் காட்டப்படும்.", "<strong>My Profile</strong> (மேல் வலதுபுறம் உங்கள் எழுத்துகளைத் தட்டுங்கள்) இல் விருப்ப நாணயத்தை அமைக்கவும். அனைத்து மொத்தங்கள், நிலுவைகள் மற்றும் தீர்வுகள் அதில் காட்டப்படும்.", "விகிதங்கள் ஒவ்வொரு நாளும் தானாகப் புதுப்பிக்கப்படும்."]]},
    {t:"📊 பட்ஜெட் (Expenses → Budget)", open:false, b:[["திட்டமிட்ட பட்ஜெட்டுடன் வகைவாரியான செலவைக் காட்டும்.", "உரிமையாளர்கள் மற்றும் நிர்வாகிகள் ஒரு வகையில் ✏️ தட்டி பட்ஜெட்டை அமைக்கலாம்.", "வகைகளை நிர்வாகி (👑 Admin → Categories) பராமரிக்கிறார்."]]},
    {t:"🤝 கணக்கைத் தீர்க்க", open:false, b:[["<strong>Current Balances</strong> பணம் செலுத்திய பிறகு யாருக்குப் பணம் வர வேண்டும் அல்லது யார் தர வேண்டும் என்பதைக் காட்டும்.", "<strong>Payments to Make</strong> யார் யாருக்குச் செலுத்த வேண்டும் என்று பட்டியலிடும். <em>Pay UPI</em> தட்டினால் தொகை நிரம்பிய UPI ஆப் திறக்கும்.", "செலுத்திய பிறகு <em>Mark Paid</em> தட்டி தொகையை (முழு அல்லது பகுதி) உள்ளிடுங்கள். பட்டியல் தானாகப் புதுப்பிக்கப்படும்.", "<strong>Payment History</strong> பதிவான அனைத்துப் பணம் செலுத்தல்களையும் காட்டும். தவறு இருந்தால் ↩️ Undo பயன்படுத்துங்கள்."]]},
    {t:"📝 நினைவுகள்", open:false, b:["ஸ்டோரியில் இருந்து குறிப்புகள் அல்லது பிடித்த தருணங்களை எழுதுங்கள். அணுகல் உள்ள அனைவரும் அவற்றைப் படிக்கலாம். உங்கள் நினைவுகளைத் திருத்தலாம் அல்லது நீக்கலாம்."]},
    {t:"📤 சுருக்கம் மற்றும் பகிர்வு", open:false, b:[["<strong>Summary</strong> தாவல் அனைத்து ஸ்டோரிகளின் மொத்தத்தையும் ஒவ்வொரு ஸ்டோரிக்கான அட்டையையும் காட்டும்.", "ஒரு ஸ்டோரியில் <em>Export &amp; Share</em> தட்டுங்கள்:"],
      ["<strong>CSV பதிவிறக்கம்:</strong> Excel அல்லது Google Sheets க்கான முழு அறிக்கை.", "<strong>Share as Text:</strong> WhatsApp, SMS அல்லது மின்னஞ்சலுக்கான சுருக்கமான செய்தி.", "<strong>Share with Pay UPI Buttons:</strong> தட்டி பணம் செலுத்தும் பொத்தான்கள் கொண்ட வலைப்பக்கம்."]]},
    {t:"👤 என் சுயவிவரம்", open:false, b:[["மேல் வலதுபுறம் உங்கள் எழுத்துகளைத் தட்டி பெயர் மற்றும் விருப்ப நாணயத்தை மாற்றுங்கள்.", "பெயரை மாற்றினால் நீங்கள் உள்ள ஸ்டோரிகளிலும் அது புதுப்பிக்கப்படும்."]]},
    {t:"👑 Admin (நிர்வாகிகளுக்கு மட்டும்)", open:false, b:[["<strong>Users:</strong> புதிய பதிவுகளைச் சரிபார்க்கவும், பயனர்களைத் தடை செய்யவும் அல்லது தடை நீக்கவும், ஒருவரை நிர்வாகியாக்கவும், அல்லது கணக்கை நீக்கவும்.", "<strong>Stories:</strong> அனைத்து ஸ்டோரிகளையும் பார்த்து எதையும் நீக்கலாம்.", "<strong>Categories:</strong> அனைவருக்கும் கிடைக்கும் செலவு வகைகளைச் சேர்க்கவும் அல்லது நீக்கவும்."]]},
    {t:"💡 தெரிந்து கொள்ள வேண்டியவை", open:false, b:[["ஆப் ஒவ்வொரு 10 வினாடிக்கும் தானாகப் புதுப்பிக்கப்படும்.", "ஸ்டோரியை மாற்ற 🔀 மற்றும் வெளியேற ⏏️ தட்டுங்கள்."]]}
  ]
},
te: {
  title:"వినియోగదారు మార్గదర్శిని",
  intro:"ఏ విభాగాన్ని తెరవాలన్నా దానిపై ట్యాప్ చేయండి. పై భాగంలోని ❓ ఐకాన్‌తో ఎప్పుడైనా ఇక్కడికి తిరిగి రావచ్చు.",
  close:"అర్థమైంది",
  sections:[
    {t:"🚀 ప్రారంభించడం", open:true, b:["మీ పేరు, ఇమెయిల్ మరియు పాస్‌వర్డ్ (6+ అక్షరాలు) తో నమోదు చేసుకోండి. మీ ఇమెయిల్‌కు OTP పంపబడుతుంది; ఖాతాను సక్రియం చేయడానికి దాన్ని నమోదు చేయండి.",
      ["మొదట నమోదు చేసిన ఖాతా <strong>Admin</strong> అవుతుంది.", "పాస్‌వర్డ్ మర్చిపోయారా? లాగిన్ స్క్రీన్‌లో <strong>Forgot password</strong> ఉపయోగించి మీ ఇమెయిల్‌కు వచ్చిన OTP నమోదు చేయండి.", "లాగిన్ అయిన తర్వాత స్టోరీ స్క్రీన్ కనిపిస్తుంది. కొత్త స్టోరీ సృష్టించండి లేదా జాబితా నుండి ఒకదాన్ని తెరవండి."]]},
    {t:"📖 స్టోరీలు", open:false, b:["<strong>స్టోరీ</strong> అంటే పంచుకున్న ఖర్చులతో కూడిన ట్రిప్ లేదా గ్రూప్, ఉదా. \"గోవా ట్రిప్ 2026\".",
      ["<strong>సృష్టించు:</strong> స్టోరీ పేరు, ఉద్దేశం మరియు ప్రారంభ తేదీ నమోదు చేసి <em>Start Story</em> నొక్కండి. మీరు దాని యజమాని అవుతారు.", "<strong>మార్చు:</strong> పై పట్టీలో 🔀 నొక్కి స్టోరీ జాబితాకు తిరిగి వెళ్లండి.", "<strong>యాక్సెస్ ఇవ్వు:</strong> యజమానులు 🔑 నొక్కి ఇమెయిల్ లేదా గ్రూప్ ద్వారా ఇతర నమోదిత వినియోగదారులకు యాక్సెస్ ఇవ్వవచ్చు.", "<strong>తొలగించు:</strong> యజమానులు Expenses ట్యాబ్‌లోని 🗑️ బటన్‌తో స్టోరీని తొలగించవచ్చు."]]},
    {t:"👥 Friends ట్యాబ్", open:false, b:[["<strong>సభ్యులు:</strong> పేరుతో ఒకరిని జోడించడానికి <em>+ Add Friend</em> నొక్కండి. ✕ తో తీసివేయండి (ఖర్చులు ఉంటే సాధ్యం కాదు). స్టోరీ యజమానిని తీసివేయలేరు.", "<strong>Share</strong> ప్రతి ఒక్కరి మొత్తం వాటాను చూపిస్తుంది. <strong>Gets back / Owes</strong> చెల్లింపుల తర్వాత వారి స్థితిని చూపిస్తుంది.", "<strong>నా గ్రూపులు:</strong> ఇమెయిళ్ల గ్రూప్ (ఉదా. కుటుంబం) సృష్టించి <em>Grant Story Access</em> నొక్కి అందరికీ ఒకేసారి యాక్సెస్ ఇవ్వండి."]]},
    {t:"💸 ఖర్చు జోడించడం", open:false, b:["Expenses ట్యాబ్ తెరిచి <strong>+ Add</strong> నొక్కండి. నింపండి:",
      ["<strong>వివరణ</strong>, <strong>కరెన్సీ</strong> మరియు <strong>మొత్తం</strong>.", "<strong>ఎవరు చెల్లించారు</strong>, ఐచ్ఛిక <strong>వర్గం</strong>, మరియు <strong>తేదీ / సమయం</strong>.", "<strong>విభజన రకం:</strong> కింద ఉన్న నాలుగు బటన్లలో ఒకదాన్ని ఎంచుకోండి."],
      ["<strong>⚖️ Equal:</strong> సభ్యులందరికీ సమానంగా విభజించండి.", "<strong>👥 Exclude:</strong> సమానంగా విభజించండి, కానీ చెల్లించాల్సిన అవసరం లేనివారి టిక్ తీసివేయండి.", "<strong>🧮 Share:</strong> ప్రతి ఒక్కరికీ వేర్వేరు సంఖ్యలో వాటాలు ఇవ్వండి (ఉదా. జంటకు 2, పిల్లలకు 1). మొత్తం వాటాలు సభ్యుల సంఖ్యకు సమానంగా ఉండాలి, లేకపోతే Add నిలిపివేయబడుతుంది.", "<strong>✏️ Custom:</strong> ప్రతి ఒక్కరికీ ఖచ్చితమైన మొత్తాన్ని నమోదు చేయండి, లేదా % ఎంచుకుని 100 అయ్యే శాతాలు నమోదు చేయండి."],
      "ఖర్చును సవరించడానికి ✏️, తొలగించడానికి ✕ నొక్కండి. మొత్తానికి సరిపోని మొత్తాలు సేవ్ కావు."]},
    {t:"🌍 బహుళ కరెన్సీలు", open:false, b:[["ఖర్చు జోడించేటప్పుడు ఏ కరెన్సీనైనా ఎంచుకోవచ్చు. రేట్ బాక్స్ ఈరోజు రేటును మరియు మార్చిన మొత్తాన్ని చూపుతుంది.", "ప్రతి వాటా మీకు ఇష్టమైన కరెన్సీలోనూ చూపబడుతుంది.", "<strong>My Profile</strong> (పై కుడివైపున మీ అక్షరాలపై నొక్కండి) లో ఇష్టమైన కరెన్సీని సెట్ చేయండి. అన్ని మొత్తాలు, బ్యాలెన్స్‌లు మరియు చెల్లింపులు అందులోనే చూపబడతాయి.", "రేట్లు ప్రతి రోజు స్వయంచాలకంగా నవీకరించబడతాయి."]]},
    {t:"📊 బడ్జెట్ (Expenses → Budget)", open:false, b:[["ప్లాన్ చేసిన బడ్జెట్‌తో వర్గాల వారీగా ఖర్చును చూపుతుంది.", "యజమానులు మరియు అడ్మిన్‌లు ఒక వర్గంపై ✏️ నొక్కి బడ్జెట్ సెట్ చేయవచ్చు.", "వర్గాలను అడ్మిన్ నిర్వహిస్తారు (👑 Admin → Categories)."]]},
    {t:"🤝 లెక్కలు తీర్చు", open:false, b:[["<strong>Current Balances</strong> చెల్లింపుల తర్వాత ఎవరికి డబ్బు రావాలి లేదా ఎవరు ఇవ్వాలి అని చూపుతుంది.", "<strong>Payments to Make</strong> ఎవరు ఎవరికి చెల్లించాలో జాబితా చేస్తుంది. <em>Pay UPI</em> నొక్కితే మొత్తం నింపిన UPI యాప్ తెరుచుకుంటుంది.", "చెల్లించిన తర్వాత <em>Mark Paid</em> నొక్కి మొత్తాన్ని (పూర్తి లేదా పాక్షిక) నమోదు చేయండి. జాబితా స్వయంచాలకంగా నవీకరించబడుతుంది.", "<strong>Payment History</strong> నమోదైన అన్ని చెల్లింపులను చూపుతుంది. పొరపాటు జరిగితే ↩️ Undo ఉపయోగించండి."]]},
    {t:"📝 జ్ఞాపకాలు", open:false, b:["స్టోరీలోని గమనికలు లేదా ఇష్టమైన క్షణాలు రాయండి. యాక్సెస్ ఉన్న అందరూ వాటిని చదవగలరు. మీ జ్ఞాపకాలను సవరించవచ్చు లేదా తొలగించవచ్చు."]},
    {t:"📤 సారాంశం & షేరింగ్", open:false, b:[["<strong>Summary</strong> ట్యాబ్ అన్ని స్టోరీల మొత్తాలను మరియు ప్రతి స్టోరీ కార్డును చూపుతుంది.", "స్టోరీపై <em>Export &amp; Share</em> నొక్కండి:"],

    {t:"👤 నా ప్రొఫైల్", open:false, b:[["పై కుడివైపున మీ అక్షరాలపై నొక్కి మీ పేరు మరియు ఇష్టమైన కరెన్సీని మార్చండి.", "పేరు మార్చితే మీరు భాగమైన స్టోరీలలో కూడా అది నవీకరించబడుతుంది."]]},
    {t:"👑 Admin (నిర్వాహకులకు మాత్రమే)", open:false, b:[["<strong>Users:</strong> కొత్త సైన్-అప్‌లను ధృవీకరించండి, వినియోగదారులను నిషేధించండి లేదా నిషేధం ఎత్తివేయండి, ఎవరినైనా అడ్మిన్ చేయండి, లేదా ఖాతాను తొలగించండి.", "<strong>Stories:</strong> అన్ని స్టోరీలను చూసి ఏదైనా తొలగించండి.", "<strong>Categories:</strong> అందరికీ అందుబాటులో ఉండే ఖర్చు వర్గాలను జోడించండి లేదా తీసివేయండి."]]},
    {t:"💡 తెలుసుకోవలసినవి", open:false, b:[["ఆప్ ప్రతి 10 సెకన్లకు స్వయంచాలకంగా నవీకరించబడుతుంది.", "స్టోరీ మార్చడానికి 🔀 మరియు లాగ్ అవుట్ చేయడానికి ⏏️ నొక్కండి."]]}
  ]

mr: {

      ["<strong>CSV डाउनलोड:</strong> Excel किंवा Google Sheets साठी संपूर्ण अहवाल.", "<strong>Share as Text:</strong> WhatsApp, SMS किंवा ईमेलसाठी छोटा संदेश.", "<strong>Share with Pay UPI Buttons:</strong> टॅप करून पैसे देण्याची बटणे असलेले वेब पेज."]]},
    {t:"👤 माझी प्रोफाइल", open:false, b:[["वर उजवीकडे तुमच्या अक्षरांवर दाबून नाव आणि पसंतीचे चलन बदला.", "नाव बदलल्यास तुम्ही असलेल्या स्टोरींमध्येही ते अपडेट होते."]]},
